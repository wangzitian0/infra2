# Platform Redis on x-infra2 (#1822 step B). common/deploy/compose_compile.py compiles this
# file with infra2-sdk `compile_compose`, and the deploy uploads the compiled text as
# Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print platform/02.redis/compose.yaml
x-infra2:
  # One vault-agent sidecar, container platform-redis-vault-agent${ENV_SUFFIX}. Its
  # template is rendered from env.manifest.json (common.security.secrets_render).
  vault:
    name: platform-redis

services:
  redis:
    mem_limit: 1g
    image: redis:alpine
    container_name: platform-redis${ENV_SUFFIX}
    restart: always
    # x-vault waits for /secrets/.env, exports it, then runs this command. PASSWORD comes
    # from that file; it is never compose env, so Dokploy never stores it.
    x-vault: {}
    command:
      - sh
      - -c
      - |
        exec redis-server --save 60 1 --loglevel warning --requirepass "$$PASSWORD"
    healthcheck:
      # Authenticated (mirrors finance_report/02.redis): the server runs --requirepass,
      # and a bare `redis-cli ping` answers "NOAUTH Authentication required." with
      # exit 0, so an unauthenticated probe reports healthy without reaching the
      # data plane (#713).
      test: [ "CMD-SHELL", ". /secrets/.env && redis-cli -a \"$$PASSWORD\" ping" ]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ${DATA_PATH}:/data
    labels:
      - "traefik.enable=false"
