# Platform Postgres on x-infra2 (#1822 step B). common/deploy/compose_compile.py compiles this
# file with infra2-sdk `compile_compose`, and the deploy uploads the compiled text as
# Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print platform/01.postgres/compose.yaml
x-infra2:
  # One vault-agent sidecar, container platform-postgres-vault-agent${ENV_SUFFIX}. Its
  # template is rendered from env.manifest.json (common.security.secrets_render).
  vault:
    name: platform-postgres

services:
  postgres:
    mem_limit: 4g
    image: postgres:16-alpine
    container_name: platform-postgres${ENV_SUFFIX}
    restart: always
    # x-vault waits for /secrets/.env, exports it, then runs this command. POSTGRES_PASSWORD
    # comes from that file; it is never compose env, so Dokploy never stores it.
    x-vault: {}
    command: [docker-entrypoint.sh, postgres]
    environment:
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ${DATA_PATH}:/var/lib/postgresql/data
    labels:
      - "traefik.enable=false"
