services:
  vault-agent:
    init: true  # tini as PID1 reaps healthcheck ssl_client zombies
    image: hashicorp/vault:1.15
    container_name: platform-todo-vault-agent${ENV_SUFFIX}
    restart: always
    mem_limit: 128m
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    entrypoint:
      - sh
      - -c
      - |
        rm -f /vault/secrets/.env /vault/.token /vault/role_id /vault/secret_id 2>/dev/null || true
        if [ -z "$$VAULT_ROLE_ID" ] || [ -z "$$VAULT_SECRET_ID" ]; then
          echo "VAULT_ROLE_ID and VAULT_SECRET_ID are required"
          exit 1
        fi
        if [ -z "$$VAULT_ADDR" ]; then
          echo "VAULT_ADDR is required"
          exit 1
        fi
        echo "$$VAULT_ROLE_ID" > /vault/role_id
        echo "$$VAULT_SECRET_ID" > /vault/secret_id
        # AppRole auto_auth: vault-agent logs in and renews/re-auths the token natively.
        exec vault agent -config=/etc/vault/vault-agent.hcl
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      ENV: ${ENV}
      IAC_CONFIG_HASH: ${IAC_CONFIG_HASH:-}
    healthcheck:
      test:
        - CMD-SHELL
        - |
          # local checks every cycle (fast): secrets rendered + no unresolved template.
          test -s /vault/secrets/.env && ! grep -q "<no value>" /vault/secrets/.env && test -s /vault/.token || exit 1
          # vault token lookup THROTTLED to ~5min (token TTL is hours) so N vault-agents
          # do not hammer Vault every 30s (#292). The local checks above still fail fast.
          if [ -z "$$(find /tmp/.vault_hc -mmin -5 2>/dev/null)" ]; then
            wget -q -T 3 --header="X-Vault-Token: $$(cat /vault/.token)" "$$VAULT_ADDR/v1/auth/token/lookup-self" -O /dev/null || exit 1
            touch /tmp/.vault_hc
          fi
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./vault-agent.hcl:/etc/vault/vault-agent.hcl:ro
      - ./secrets.ctmpl:/etc/vault/secrets.ctmpl:ro
      - secrets:/vault/secrets
    networks:
      - dokploy-network

  todo:
    build:
      context: ../..
      dockerfile: platform/30.todo/Dockerfile
    image: platform-todo:${IAC_CONFIG_HASH:-latest}
    container_name: platform-todo${ENV_SUFFIX}
    restart: always
    mem_limit: 256m
    cpu_shares: 512
    depends_on:
      - vault-agent
    # The Redis password, the Postgres canary password and the S3 canary key come from the
    # vault-agent's rendered file. They are never compose env, so Dokploy never stores them.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        waited=0
        max_wait="$${TODO_SECRETS_WAIT_SECONDS:-300}"
        while [ ! -s /secrets/.env ] && [ "$$waited" -lt "$$max_wait" ]; do
          echo "Waiting for todo secrets file..."
          sleep 2
          waited=$$((waited + 2))
        done
        if [ ! -s /secrets/.env ]; then
          echo "ERROR: /secrets/.env is missing or empty"
          exit 1
        fi
        set -a
        . /secrets/.env
        set +a
        exec python /app/app.py
    environment:
      PORT: "8000"
      # The SDK resolves the environment tier from ENV when it configures telemetry.
      ENV: ${ENV}
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-zitian.party}
      ENV_SUFFIX: ${ENV_SUFFIX:-}
      POSTGRES_HOST: platform-postgres${ENV_SUFFIX}
      POSTGRES_PORT: "5432"
      # Dedicated read-only role. TodoDeployer.CANARY_PG_ROLE creates it on every sync.
      CANARY_POSTGRES_USER: canary_ro
      CANARY_POSTGRES_DATABASE: postgres
      REDIS_HOST: platform-redis${ENV_SUFFIX}
      REDIS_PORT: "6379"
      CANARY_S3_ENDPOINT_URL: http://platform-s3${ENV_SUFFIX}:9000
      CANARY_S3_BUCKET: platform-canary
      SIGNOZ_OTEL_COLLECTOR: http://platform-signoz-otel-collector:13133
      OPENPANEL_API_URL: http://platform-openpanel-api:3000/healthcheck
      AUTHENTIK_ENDPOINT: http://platform-authentik-server${ENV_SUFFIX}:9000/-/health/live/
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      # Telemetry (#991). The endpoint turns export on and the service refuses to start
      # on it without the identity, so both identity variables come verbatim from the
      # deploy (TodoDeployer.telemetry_service_name), never hardcoded or defaulted.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-signoz-otel-collector:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.platform-todo${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=8000"

      # Public bypass router: unauthenticated access to the health path ONLY.
      # /api/canary/status is not here: it returns internal hostnames and raw errors and
      # runs six real probes per request. The probe runner reads it over the Docker
      # network; people reach it through the SSO router below.
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.rule=Host(`todo${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`) && Path(`/api/health`)"
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.priority=100"
      - "traefik.http.routers.platform-todo-public${ENV_DOMAIN_SUFFIX}.service=platform-todo${ENV_DOMAIN_SUFFIX}"

      # Authentik ForwardAuth middleware
      - "traefik.http.middlewares.todo-auth${ENV_DOMAIN_SUFFIX}.forwardauth.address=http://platform-authentik-server${ENV_SUFFIX}:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.todo-auth${ENV_DOMAIN_SUFFIX}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.todo-auth${ENV_DOMAIN_SUFFIX}.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"

      # Protected router: UI and interactive APIs protected by Authentik SSO
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.rule=Host(`todo${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.priority=10"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.middlewares=todo-auth${ENV_DOMAIN_SUFFIX}@docker"
      - "traefik.http.routers.platform-todo${ENV_DOMAIN_SUFFIX}.service=platform-todo${ENV_DOMAIN_SUFFIX}"

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
