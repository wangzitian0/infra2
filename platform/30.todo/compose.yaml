# Canary Todo on x-infra2 (#1822 Slice 2). common/deploy/compose_compile.py compiles this
# file with infra2-sdk `compile_compose`, and the deploy uploads the compiled text as
# Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print platform/30.todo/compose.yaml
x-infra2:
  # One vault-agent sidecar, container platform-todo-vault-agent${ENV_SUFFIX}. Its template
  # is rendered from env.manifest.json (common.security.secrets_render) at deploy time.
  vault:
    name: platform-todo

services:
  todo:
    # Built and published by infra2-sdk release.yml from canary/todo at the same tag, so the
    # tag is the SDK version the Canary proves (infra2-sdk#247). common/deploy/canary_pin.py
    # is the one reader of this line.
    # Staging soak trigger: prove the locked Canary image before app rollout.
    image: ghcr.io/wangzitian0/infra2-canary-todo:v4.13.0@sha256:ec62302213a62f521266089bfb6044a339fb03c6fd4958933c33d768899a63f1
    container_name: platform-todo${ENV_SUFFIX}
    mem_limit: 256m
    cpu_shares: 512
    # x-vault waits for /secrets/.env, loads it, then runs this command. The Redis password,
    # DATABASE_URL and the S3 canary key come from that file. They are never compose env,
    # so Dokploy never stores them.
    command: ["python", "/app/app.py"]
    x-vault: {}
    # s3: S3_ENDPOINT. otel: OTEL_* from deploy identity. openpanel + browser_otel:
    # analytics and browser OTLP configuration (#1823).
    x-capabilities:
      s3: {}
      otel: {}
      openpanel:
        script: true
      browser_otel: {}
    environment:
      PORT: "8000"
      ENVIRONMENT: ${ENV}
      # The Canary image has no default hosts: /api/canary/status turns red without REDIS_URL
      # (from Vault) and each of S3_ENDPOINT, SIGNOZ_OTEL_COLLECTOR, OPENPANEL_HEALTH_URL and
      # AUTHENTIK_ENDPOINT (common/tests/test_todo_canary_depth.py pins the values).
      S3_BUCKET: platform-canary
      SIGNOZ_OTEL_COLLECTOR: http://platform-signoz-otel-collector:13133
      OPENPANEL_HEALTH_URL: http://platform-openpanel-api:3000/healthcheck
      AUTHENTIK_ENDPOINT: http://platform-authentik-server${ENV_SUFFIX}:9000/-/health/live/
      # The deploy issues the full infra2 SHA as INFRA_IAC_REF. The page shows its first 7 characters.
      GIT_COMMIT_SHA: ${INFRA_IAC_REF:-unknown}
      # infra2-sdk reads the service version only from SERVICE_VERSION (#1823 N1). The deploy
      # issues INFRA_SERVICE_VERSION, the version that OTEL_RESOURCE_ATTRIBUTES also carries.
      SERVICE_VERSION: ${INFRA_SERVICE_VERSION:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_SMALL_MODEL: ${LLM_SMALL_MODEL:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=8).read()\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    x-routes:
      service: platform-todo
      port: 8000
      routes:
        # Public bypass router: unauthenticated access to the health path ONLY.
        # /api/canary/status is not here: it returns internal hostnames and raw errors and
        # runs six real probes per request. The probe runner reads it over the Docker
        # network; people reach it through the SSO router below.
        - name: platform-todo-public
          rule: Host(`todo${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`) && Path(`/api/health`)
          tls: true
          priority: 100
        # Protected router: UI and interactive APIs behind Authentik ForwardAuth.
        - name: platform-todo
          rule: Host(`todo${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)
          tls: true
          priority: 10
          sso: todo-auth
