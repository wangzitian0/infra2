services:
  vault-agent:
    init: true  # tini as PID1 reaps healthcheck ssl_client zombies
    image: hashicorp/vault:1.15
    container_name: platform-s3-vault-agent${ENV_SUFFIX}
    restart: always
    mem_limit: 128m
    mem_reservation: 32m
    entrypoint:
      - sh
      - -c
      - |
        rm -f /vault/secrets/.env /vault/.token /vault/role_id /vault/secret_id 2>/dev/null || true
        if [ -z "$$VAULT_ROLE_ID" ] || [ -z "$$VAULT_SECRET_ID" ]; then
          echo "VAULT_ROLE_ID and VAULT_SECRET_ID are required"
          exit 1
        fi
        if [ -z "$$VAULT_ADDR" ]; then
          echo "VAULT_ADDR is required"
          exit 1
        fi
        echo "$$VAULT_ROLE_ID" > /vault/role_id
        echo "$$VAULT_SECRET_ID" > /vault/secret_id
        # AppRole auto_auth: vault-agent logs in and renews/re-auths the token
        # natively. No token_file decay, no manual renew loop.
        exec vault agent -config=/etc/vault/vault-agent.hcl
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      ENV: ${ENV}
      # Cache-bust (#628): secrets.ctmpl is a single-file bind mount, so a checkout that
      # rewrites it leaves the running agent on the old inode, and Compose only recreates
      # a service whose resolved config changed. The hash covers the template, so a
      # template edit recreates the agent instead of shipping as a silent no-op.
      IAC_CONFIG_HASH: ${IAC_CONFIG_HASH:-}
    volumes:
      - ./vault-agent.hcl:/etc/vault/vault-agent.hcl:ro
      - ./secrets.ctmpl:/etc/vault/secrets.ctmpl:ro
      - secrets:/vault/secrets
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    healthcheck:
      test:
        - CMD-SHELL
        - |
          # local checks every cycle (fast): secrets rendered + no unresolved template.
          test -s /vault/secrets/.env && ! grep -q "<no value>" /vault/secrets/.env && test -s /vault/.token || exit 1
          # vault token lookup THROTTLED to ~5min (token TTL is hours) so N vault-agents
          # do not hammer Vault every 30s (#292). The local checks above still fail fast.
          if [ -z "$$(find /tmp/.vault_hc -mmin -5 2>/dev/null)" ]; then
            wget -q -T 3 --header="X-Vault-Token: $$(cat /vault/.token)" "$$VAULT_ADDR/v1/auth/token/lookup-self" -O /dev/null || exit 1
            touch /tmp/.vault_hc
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  s3:
    # S3-compatible Object Storage service (currently powered by RustFS 1.0.0 engine)
    # Built with mc embedded to preserve 100% compatibility with shared tasks and scripts (#930)
    build:
      context: ../..
      dockerfile: platform/03.s3/Dockerfile
    pull_policy: build
    image: platform-s3:${IAC_CONFIG_HASH:-latest}
    container_name: platform-s3${ENV_SUFFIX}
    restart: always
    mem_limit: 2g
    mem_reservation: 256m
    depends_on:
      - vault-agent
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
    entrypoint:
      - sh
      - -c
      - |
        # Wait for secrets file to be rendered by vault-agent
        while [ ! -f /secrets/.env ]; do
          echo "Waiting for secrets..."
          sleep 1
        done
        set -a
        . /secrets/.env
        set +a
        # Root credentials exported for generic S3, RustFS, and MinIO backends
        ROOT_USER="$${S3_ROOT_USER:-$${MINIO_ROOT_USER:-admin}}"
        ROOT_PASSWORD="$${S3_ROOT_PASSWORD:-$${MINIO_ROOT_PASSWORD}}"
        export S3_ROOT_USER="$$ROOT_USER"
        export S3_ROOT_PASSWORD="$$ROOT_PASSWORD"
        export RUSTFS_ROOT_USER="$$ROOT_USER"
        export RUSTFS_ROOT_PASSWORD="$$ROOT_PASSWORD"
        export RUSTFS_ACCESS_KEY="$$ROOT_USER"
        export RUSTFS_SECRET_KEY="$$ROOT_PASSWORD"
        exec /entrypoint.sh --address ":9000" --console-address ":9001" /data
    healthcheck:
      # wget is present in the rustfs/rustfs:1.0.0 base image (Alpine layer).
      # curl is also available but wget is lighter and needs no extra flags.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1" ]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    # Host-loopback publish for host-network consumers (truealpha's dagster
    # containers run with network_mode host for the loopback Postgres ports
    # and cannot route into the dokploy overlay). Same pattern as truealpha
    # postgres (staging 15432 / production 15433): deploy.py injects a fixed
    # per-env port so both stacks coexist on one box; other lanes get an
    # ephemeral port. Surfaced by truealpha#496: the first LARGE new payload
    # (a 3.4MB predecessor company-facts document) was also the first real
    # S3 write from a host-network consumer, and 127.0.0.1:9000 pointed at
    # nothing.
    ports:
      - "${S3_HOST_PORT:-${MINIO_S3_HOST_PORT:-127.0.0.1:0}}:9000"
    volumes:
      - secrets:/secrets:ro
      - ${DATA_PATH}:/data
    networks:
      dokploy-network:
        aliases:
          - platform-s3${ENV_SUFFIX}
          - platform-rustfs${ENV_SUFFIX}
          - platform-minio${ENV_SUFFIX}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      # S3 API Router -> Port 9000
      - "traefik.http.routers.platform-s3-api${ENV_DOMAIN_SUFFIX}.rule=Host(`s3${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.platform-s3-api${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.platform-s3-api${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.platform-s3-api${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.platform-s3-api${ENV_DOMAIN_SUFFIX}.service=platform-s3-api${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.platform-s3-api${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=9000"
      # S3 Console Router -> Port 9001 (fixes #941: supports s3-console, rustfs, and legacy minio domains)
      - "traefik.http.routers.platform-s3-console${ENV_DOMAIN_SUFFIX}.rule=Host(`s3-console${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`) || Host(`rustfs${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`) || Host(`minio${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.platform-s3-console${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.platform-s3-console${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.platform-s3-console${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.platform-s3-console${ENV_DOMAIN_SUFFIX}.service=platform-s3-console${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.platform-s3-console${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=9001"

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
