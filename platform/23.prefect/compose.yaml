# Platform Prefect on x-infra2 (#1822 step B). common/deploy/compose_compile.py compiles this
# file with infra2-sdk `compile_compose`, and the deploy uploads the compiled text as
# Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print platform/23.prefect/compose.yaml
x-infra2:
  # One vault-agent sidecar, container platform-prefect-vault-agent${ENV_SUFFIX}. Its
  # template is rendered from env.manifest.json (common.security.secrets_render).
  vault:
    name: platform-prefect

services:
  prefect-server:
    # Pinned by digest (prefect 3.7.4 / prefect-redis 0.2.11). The :3-latest tag
    # had drifted: the host cached a Jan-2026 image with prefect-redis 0.2.8,
    # whose Redis-messaging consumer leaked ephemeral consumer groups and
    # busy-polled while idle. 0.2.11 ships the ephemeral-group cleanup + batch
    # ack. Pinning the digest stops the tag from silently going stale again.
    image: prefecthq/prefect:3-latest@sha256:c10cc349f947da083a1cfb36c031f85806befe67a285a8e54a753226ddd505ec
    container_name: platform-prefect-server${ENV_SUFFIX}
    restart: unless-stopped
    # ops.standards §5 resource governance: ceiling with headroom over observed
    # ~3G; cpu_shares scales by tier via env.
    mem_limit: 4g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    depends_on:
      vault-agent:
        condition: service_healthy
    # x-vault waits for /secrets/.env, exports it, then runs this command. POSTGRES_PASSWORD
    # and REDIS_PASSWORD come from that file; they are never compose env, so Dokploy
    # never stores them.
    x-vault: {}
    # Construct DATABASE_URL with password from secrets
    command:
      - sh
      - -c
      - |
        export PREFECT_API_DATABASE_CONNECTION_URL="postgresql+asyncpg://postgres:$${POSTGRES_PASSWORD}@platform-postgres${ENV_SUFFIX}:5432/prefect"
        export PREFECT_REDIS_MESSAGING_PASSWORD="$${REDIS_PASSWORD}"
        exec prefect server start --no-services
    environment:
      ENV_SUFFIX: ${ENV_SUFFIX}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # Enable flow_runs + orphaned logs vacuum alongside default events (#1694/ops hygiene).
      PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED: "events,flow_runs"
      PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD: "14 days"
      # Redis messaging
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: platform-redis${ENV_SUFFIX}
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 1
    labels:
      - "traefik.enable=true"
      # SSO-protected access via Authentik forward auth
      # Env-scoped router/service/middleware names + host so staging and
      # production do not collide on the same Traefik route, and so staging's
      # forward-auth targets the staging Authentik (not prod). Matches the
      # platform/21.portal pattern. ${ENV_DOMAIN_SUFFIX} is empty in production
      # (URL unchanged) and "-staging" elsewhere.
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.rule=Host(`prefect${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.service=prefect${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.prefect${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=4200"
      # Authentik forward auth middleware (env-scoped name + target)
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.address=http://platform-authentik-server${ENV_SUFFIX}:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.middlewares=prefect-auth${ENV_DOMAIN_SUFFIX}@docker"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:4200/api/health', timeout=1).read().strip() == b'true' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    # Pinned by digest (prefect 3.7.4 / prefect-redis 0.2.11). The :3-latest tag
    # had drifted: the host cached a Jan-2026 image with prefect-redis 0.2.8,
    # whose Redis-messaging consumer leaked ephemeral consumer groups and
    # busy-polled while idle. 0.2.11 ships the ephemeral-group cleanup + batch
    # ack. Pinning the digest stops the tag from silently going stale again.
    image: prefecthq/prefect:3-latest@sha256:c10cc349f947da083a1cfb36c031f85806befe67a285a8e54a753226ddd505ec
    container_name: platform-prefect-services${ENV_SUFFIX}
    restart: unless-stopped
    mem_limit: 1g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    depends_on:
      prefect-server:
        condition: service_healthy
    # x-vault waits for /secrets/.env, exports it, then runs this command. POSTGRES_PASSWORD
    # and REDIS_PASSWORD come from that file; they are never compose env, so Dokploy
    # never stores them.
    x-vault: {}
    # Construct DATABASE_URL with password from secrets
    command:
      - sh
      - -c
      - |
        export PREFECT_API_DATABASE_CONNECTION_URL="postgresql+asyncpg://postgres:$${POSTGRES_PASSWORD}@platform-postgres${ENV_SUFFIX}:5432/prefect"
        export PREFECT_REDIS_MESSAGING_PASSWORD="$${REDIS_PASSWORD}"
        exec prefect server services start
    environment:
      ENV_SUFFIX: ${ENV_SUFFIX}
      # Prefect 3 defaults DB_VACUUM_ENABLED to {"events"} only, leaving flow_runs and logs unpruned.
      PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED: "events,flow_runs"
      PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD: "14 days"
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: platform-redis${ENV_SUFFIX}
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 1
    healthcheck:
      # #163/#531: prefect-services runs prefect's background service loops
      # (scheduler/foreman/cancellation-cleanup/late-runs/etc, all ticking every
      # 5-60s per `prefect.settings...server.services`) with NO HTTP port and NO
      # live-status CLI surface -- `prefect server services ls` only dumps
      # static enabled/disabled config from settings, not whether the running
      # loops are actually ticking (verified against the installed prefect 3.7.4
      # CLI). A log-freshness heartbeat was considered and ruled out: this
      # container's own logs showed a genuine 7-day silent gap between lines
      # while idle and healthy (verified live), so any "logged in the last N
      # minutes" threshold would false-positive during ordinary quiet periods --
      # exactly the sparse-logging trap #531 is about. The best real signal
      # available is an ACTIVE, per-check network round-trip (fresh TCP connect,
      # not a passive read of already-open sockets) from this container's own
      # network namespace to both hard dependencies every one of those loops
      # needs: Postgres (state) and Redis (messaging). This does not prove the
      # asyncio loops aren't wedged -- no such probe exists for this role -- but
      # it catches container-specific DNS/network-partition failures that
      # Docker's bare `state=running` never would, and it is strictly more
      # meaningful than a `pgrep`-style liveness check (which running already
      # covers).
      test:
        - CMD-SHELL
        - |
          python -c "
          import socket, sys
          targets = [('platform-redis${ENV_SUFFIX}', 6379), ('platform-postgres${ENV_SUFFIX}', 5432)]
          bad = []
          for host, port in targets:
              try:
                  socket.create_connection((host, port), timeout=3).close()
              except OSError:
                  bad.append(host)
          sys.exit(1 if bad else 0)
          "
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

