# Infra CI gate inventory — every gate is one coordinate (stage, task_category) -> workflow:job.
# Gate ids carry the `infra_ci.` prefix (structurally disjoint from app's `ci.*`, so the two
# repos' inventories cannot overlap). `stage` references the infra2-sdk delivery vocabulary;
# infra2_sdk/data/stages.yaml of the pinned SDK is its only definition; infra2 keeps no copy.
# Validated by tools/ci_gate_audit.py.
#
# Scope is COMPUTED, not listed: a workflow's jobs must all be registered here exactly when
# that workflow runs on a pull request (`pull_request` / `pull_request_target`), because that
# is precisely when a job can appear on a PR without anyone deciding whether it gates merge.
# Today that is infra-ci.yml and docs.yml; the other workflows (including ops-checks.yml)
# never run on a PR, so they are `out_of_scope_workflows` in the audit's JSON -- not backlog,
# just unable to gate. Add `pull_request:` to a workflow and it becomes covered automatically;
# its jobs then have to be registered or infra-ci.yml's `--enforce` step fails.
#
# Non-PR scheduled operational jobs live in `.github/workflows/ops-checks.yml` and are not
# listed here; only pull-request workflows belong in this merge-gate inventory.
# Every non-ruleset gate below is `blocks_merge: false`: the set of `blocks_merge: true`
# gates equals, exactly, the 7 required status checks in the live branch ruleset. Promoting
# any gate to `blocks_merge: true` must add the ruleset context alongside it.
version: 1
repo_prefix: infra_ci.
gates:
  - id: infra_ci.compose_validate
    stage: github_ci.merge_authority
    task_category: compose_validate
    workflow: .github/workflows/infra-ci.yml
    job: validate-compose
    blocks_merge: true
    failure_semantics: A compose file is invalid or pins a bare :latest image.
  - id: infra_ci.deployer_logic
    stage: github_ci.merge_authority
    task_category: deployer_contract
    workflow: .github/workflows/infra-ci.yml
    job: test-deployer-logic
    blocks_merge: true
    failure_semantics: Deployer config-hash idempotency, container healthcheck verification, pre-deploy schema gate, service discovery, or unit tests fail.
  - id: infra_ci.unit_shard
    stage: github_ci.merge_authority
    task_category: deployer_contract
    workflow: .github/workflows/infra-ci.yml
    job: test-unit-shard
    # Not a required context itself: the required check `Test Deployer Hash Logic`
    # (infra_ci.deployer_logic) needs it, runs with always(), and fails unless every shard succeeded.
    # One exception, on a push to main only: the shards are skipped when a green pull-request run
    # of the merged pull request tested the same tree; the check then reads that run's coverage (#1602).
    blocks_merge: false
    failure_semantics: A unit test in this shard of the traced pytest run fails (#1499).
  - id: infra_ci.op_healthcheck
    stage: github_ci.merge_authority
    task_category: secret_preflight
    workflow: .github/workflows/infra-ci.yml
    job: test-1password-healthcheck
    blocks_merge: true
    failure_semantics: The 1Password healthcheck binary fails to build or pass.
  - id: infra_ci.vault_agent
    stage: github_ci.merge_authority
    task_category: vault_agent
    workflow: .github/workflows/infra-ci.yml
    job: validate-vault-agent
    blocks_merge: true
    failure_semantics: vault-agent.hcl is missing required settings.
  - id: infra_ci.deployer_classes
    stage: github_ci.merge_authority
    task_category: deployer_contract
    workflow: .github/workflows/infra-ci.yml
    job: validate-deployers
    blocks_merge: true
    failure_semantics: A Deployer subclass violates the deployer contract.
  - id: infra_ci.lint_python
    stage: github_ci.merge_authority
    task_category: static_contract
    workflow: .github/workflows/infra-ci.yml
    job: lint-python
    blocks_merge: true
    failure_semantics: Python lint (ruff) fails.
  - id: infra_ci.harness_check
    stage: github_ci.merge_authority
    task_category: workspace_harness
    workflow: .github/workflows/infra-ci.yml
    job: harness-check
    blocks_merge: true
    failure_semantics: harness/repos.yaml is internally inconsistent (schema, governance/role mismatch, missing authority file, or an unexpected non-optional uninitialized checkout).
  - id: infra_ci.detect_changes
    stage: github_ci.merge_authority
    task_category: change_detection
    workflow: .github/workflows/infra-ci.yml
    job: detect-changes
    # Not itself one of the 7 required-status-check names in the branch
    # ruleset, so it cannot directly block merge the way the other gates
    # above do -- but every other job in this workflow depends on it
    # (needs: detect-changes) and is skipped, not merely deprioritized, if
    # it fails, which transitively blocks every gate below. Declared here
    # (rather than left unregistered) because it IS a real job of a
    # fully-covered workflow -- the audit's own coverage invariant.
    blocks_merge: false
    failure_semantics: The PR-vs-base diff could not be computed (e.g. a force-pushed/rewritten base), so every other infra-ci job that depends on it is skipped rather than run.
  - id: infra_ci.docs_build
    stage: github_ci.merge_authority
    task_category: docs_build
    workflow: .github/workflows/docs.yml
    job: build
    # Runs on every docs-touching PR but is not one of the 7 required contexts in the
    # branch ruleset, so a broken docs build cannot itself block merge today.
    blocks_merge: false
    failure_semantics: The MkDocs site fails to build (broken nav, missing page, or a strict-mode warning).
  - id: infra_ci.docs_deploy
    stage: prod.release_integrity
    task_category: docs_publish
    workflow: .github/workflows/docs.yml
    job: deploy
    # `if: push && refs/heads/main` -- never runs on a PR, but it is a job of a covered
    # workflow, so the audit's coverage invariant requires it declared.
    blocks_merge: false
    failure_semantics: The built docs site fails to publish to GitHub Pages after a merge to main.
  - id: infra_ci.stage_record
    stage: github_ci.merge_authority
    task_category: change_detection
    workflow: .github/workflows/infra-ci.yml
    job: record
    # A push to main only. It reports the result of the blocks_merge jobs as a stage record
    # (#1645); it gates nothing, and it holds no secret.
    blocks_merge: false
    failure_semantics: The CI post record of a commit on main is not written or not uploaded.
  - id: infra_ci.platform_image_tags
    stage: github_ci.merge_authority
    task_category: image_publish
    workflow: .github/workflows/platform-images.yml
    job: matrix
    # Computes the GHCR tag of each platform image from its input files (#1822).
    blocks_merge: false
    failure_semantics: A platform image input file is missing, or the matrix of common/deploy/platform_images.py cannot be computed.
  - id: infra_ci.platform_image_publish
    stage: github_ci.merge_authority
    task_category: image_publish
    workflow: .github/workflows/platform-images.yml
    job: publish
    # Not a required context yet: promoting it to blocks_merge needs a ruleset context in
    # the same change. The offline unit test test_platform_images.py blocks a stale tag.
    blocks_merge: false
    failure_semantics: A platform image fails to build or push, the compose pins a digest that is not the GHCR digest of the tag, or the tag does not pull without credentials.
  - id: infra_ci.promotion_probe
    stage: github_ci.merge_authority
    task_category: change_detection
    workflow: .github/workflows/infra-ci.yml
    job: promotion-probe
    # A pull request only. It runs the production promotion guard on the real stage records
    # when the pull request changes the guard files (#1830); it changes nothing and holds
    # no secret. It is not a required context: an open production decision is not a
    # defect of the pull request.
    blocks_merge: false
    failure_semantics: The production promotion guard would refuse the next release candidate on the real stage records.
  - id: infra_ci.harness_replay
    stage: github_ci.merge_authority
    task_category: gate_replay
    workflow: .github/workflows/infra-ci.yml
    job: harness-replay
    # Runs only when a PR touches a file of `self_governing_files()`; posts the verdict
    # diff against origin/main (#1653). Does not block on `looser`, fails only on error.
    blocks_merge: false
    failure_semantics: The merge-gate replay over the last 20 merged PRs failed to execute or report.
