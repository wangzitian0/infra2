  # Peer liveness for truealpha's scheduler-liveness workflow (truealpha#876 W5).
  # That workflow watches every scheduled workflow in the estate but cannot report
  # its own dead scheduler; tools/out_of_band_watchdog.py
  # run_peer_scheduler_liveness_check (libs/scheduler_peer_liveness.py) is the peer.
  # Red when the workflow is not active, its newest scheduled run is older than the
  # bound measured from its crons (2 x largest gap + 1 h; 13 h today), it never ran
  # and its file is older than that bound, or the read fails. component=github: the
  # GitHub Actions scheduler is the thing being watched. Daily, like the rest of the
  # GitHub plane, so detection lags a dead scheduler by up to bound + 24 h.
  - signal_id: global.truealpha-scheduler-liveness.github
    environment: global
    component: github
    signal: truealpha-scheduler-liveness
    primary_owner: github
    failure_class: peer-scheduler
    severity: critical
    cadence: 1d

  # Weekly off-host backups and the restore rehearsal (#895). Until this, both only
  # wrote host log files: #618's aborted prod runs went unnoticed for weeks and the
  # rehearsal cron in #892 had never run. tools/out_of_band_watchdog.py
  # run_backup_checks reads each environment's latest manifest over SSH and judges
  # it with the SOP-004 verifier (every BackupFacet present, within its RPO, sized,
  # checksummed, off-host) plus the manifest's own environment field. The rehearsal
  # check wants the cron log's final line to be the all-services pass summary,
  # written within the same RPO. Daily, so a missed Sunday run is red by Monday.
  - signal_id: production.infra2-backup-production.github
    environment: production
    component: host
    signal: infra2-backup-production
    primary_owner: github
    failure_class: data-protection
    severity: critical
    cadence: 1d

  # Staging never pages (#908): a stale Staging backup is a report line.
