    cadence: 30m
    expected: "200,302"
    url: https://cloud.zitian.party
    tier: hour
    type: alert
    consecutive_failures: 2 # WATCHDOG_ENTRYPOINT_FAILURE_RUNS: one GET per 30-minute run, no in-run retry
    renotify_window_sec: 21600 # WATCHDOG_RENOTIFY_SECONDS

