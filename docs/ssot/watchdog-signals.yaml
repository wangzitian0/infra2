  # The production probe-runner heartbeat pages two ways, both from the Worker:
  # stale -> P0 "VPS or its egress is down" (host-reachability, also a Cloudflare
  # class), where the staleness threshold is the debounce, so one failing run
  # fires; a fresh v2 heartbeat with ok=false for 2 consecutive runs -> P1 "probe
  # loop unhealthy" (alert-pipeline), resolved after 2 healthy runs. A v1 ok is unknown.
  - signal_id: production.alerting-probes.heartbeat
    environment: production
    component: alerting
    signal: platform-alerting-probes
    primary_owner: cloudflare
    failure_class: alert-pipeline
    severity: critical
    cadence: 30m
    stale_threshold: 90m
    tier: hour
    type: alert
    consecutive_failures: 1 # stale_threshold is the debounce
    renotify_window_sec: 21600 # WATCHDOG_RENOTIFY_SECONDS

  # Staging is recorded by the Worker and shown on /status, never paged (#904).
  - signal_id: staging.alerting-probes.heartbeat
    environment: staging
    component: alerting
    signal: platform-alerting-probes-staging
    primary_owner: cloudflare
    failure_class: alert-pipeline
    severity: warning
    cadence: 30m
    stale_threshold: 90m
    tier: day
    type: report

  # GitHub signals whose failure class another layer pages (#908): the daily audit
  # still runs them and tools/out_of_band_watchdog.py puts their failures in one
  # daily report to the reports chat, never the pager and never the issue trail.
  # The watchdog reads `type` from this file: a check pages unless it is
  # registered here as `type: report` (a name added only through the
  # INFRA2_WATCHDOG_*_TARGETS repository variables pages too), and the layering
  # audit fails a paging signal whose class github does not own.
  - signal_id: global.infra2-public-entrypoint.github
    environment: global
    component: host
    signal: infra2-public-entrypoint
    primary_owner: github
    failure_class: host-reachability
    severity: critical
    cadence: 1d
    tier: day
    type: report

  # Dokploy per-compose/application status (#908). One signal for the family: each
  # unit in `error` is reported as dokploy-status:<project>/<env>/<unit> under it.
  # A unit is a stale record (still listed) only when its own containers run
  # healthy on the current IAC_CONFIG_HASH; a query rejected with 401/403 is a
  # configuration failure and pages like every other blind-watchdog failure.
  - signal_id: global.infra2-dokploy-status.github
    environment: global
    component: dokploy
    signal: infra2-dokploy-status
    primary_owner: github
    failure_class: service-health
    severity: warning
    cadence: 1d
    tier: day
    type: report

  # Worker liveness (#908): red when the Worker's last run is older than its own
  # WATCHDOG_STATUS_MAX_AGE_SECONDS (read from cloudflare/infra-watchdog/wrangler.toml)
  # or could not deliver its alerts -- liveness is "runs AND delivers". What a run
  # found and delivered is a report note, not a page: the Worker paged it already.
  # The former cloudflare-worker-health signal called the Worker's /health, which
  # always answers ok, so it could detect nothing and was removed.
  - signal_id: global.cloudflare-worker-status.github
    environment: global
    component: cloudflare-watchdog
    signal: cloudflare-worker-status
    primary_owner: github
    failure_class: watchdog-liveness
    severity: critical
    cadence: 1d

