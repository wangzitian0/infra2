# Deploy dependency manifest (SSOT for fan-out + config-hash).
#
# Every service is IMPLICITLY deploy-dependent on its own directory. List here
# only EXTRA build/config artifacts a service bakes in (shared code, contracts,
# pinned upstream files) whose change must (a) fan out to that service and
# (b) change its content hash.
#
# Principle: fan-out follows BUILD/CONFIG dependencies, NOT runtime connections.
#   - A shared Postgres/Redis/ClickHouse CONFIG change must NOT redeploy its
#     consumers — they reconnect at runtime. Do not list them.
#   - Only declare a dependency the service literally embeds (build context,
#     a copied contract file, a pinned config).
#   - common/ and tools/ are deploy tooling — no service RUNTIME-depends on them,
#     so by default they fan out to nothing (the iac-runner re-checks-out new
#     code itself). The exception is a service that COPIES them into its image at
#     BUILD time: that service bakes the code in and MUST be declared below.
#
# Format:
#   services:
#     <project>/<service>:
#       depends_on:
#         - <repo-relative glob>     # e.g. common/contracts/analytics.py
#
# Globs are fnmatch-style against repo-relative changed-file paths.
#
# Host templates (#1438): a compose bind mount `${DATA_PATH}/<name>` renders a host
# file from `<name>` or `<name>.tmpl` in the service directory. The config hash reads
# that template, so a template edit flips the hash and `sync` deploys it. The guard
# fails when such a `<name>` mount has no template. Name each template in the service
# directory; the compose mount is the single declaration. `deploy.py` must deliver the
# rendered file from `composing()`, because `sync` skips `pre_compose()`.
# The service must also read `${IAC_MOUNT_SHA256_<NAME>:-}` in a label, and
# `composing()` must set that variable to the sha256 of the rendered bytes. Compose
# recreates a container only when its resolved config changes, so a changed file
# alone leaves the old container running. The guard fails when the label is missing.
#
# Enforcement: `tools/deploy_guard_audit.py` (the infra-ci `ci_runner preflight`
# gate "Deploy guard audit" + the scheduled ops-checks step "Audit deploy fan-out
# coverage (sufficiency)") fails if any file
# the config hash reads for a service (Dockerfile COPY/ADD source resolved against
# the build context, or bind mount) is outside the service directory and matches
# no glob here (#1117). Examples: `COPY common /app/common`, `COPY uv.lock /tmp/`.
# The iac-runner logs the per-run fan-out decision (selected services + reasons +
# changed files that fanned out to nothing). Changes to this manifest or to the
# shared source-config-hash formula (`common/deploy/deployer.py`,
# `common/deploy/config_hash.py`) reconcile all `iac_pinned` services.
version: 1
services:
  # platform/alerting's Dockerfile does `COPY common /app/common` and
  # `COPY tools /app/tools` with build context = repo root, so it bakes both
  # trees into its image. A change to either must redeploy it; without this
  # entry alerting would silently run stale tooling.
  #
  # The deploy.py globs (#541): alerting's INFRA_PROBE_SPECS env is RENDERED
  # from every service's ProbeFacet declarations (deploy.py Deployer attrs),
  # so a probe change in ANY deploy.py must fan out to alerting and flip its
  # config hash — otherwise the runner keeps probing the previous set.
  platform/alerting:
    depends_on:
      - common/**
      - tools/**
      - platform/*/deploy.py
      - finance_report/finance_report/*/deploy.py
      - truealpha/truealpha/*/deploy.py
      - uv.lock

  # platform/signoz renders otel-collector-config.yaml on the host (#1438). The
  # CORS allow-list in that file comes from `cors_allowed_origins()`, which reads
  # `env_config.py` and, through `service_spec()`, `contract.py`. A change to either
  # changes the rendered file, so it must flip this hash. The test
  # `test_rendered_template_source_modules_are_hash_dependencies` derives this list
  # from the `_render*` functions of the deploy.py and fails when a module is missing.
  platform/signoz:
    depends_on:
      - common/deploy/env_config.py
      - common/deploy/contract.py

  # platform/portal renders the "Applications" group of config.yml from the service
  # registry (#1467): each app's public route (its Deployer), the SigNoz host, and the
  # `observability/dashboard.json` files the dashboard links exist for. A change to any
  # of them changes the rendered file, so it must flip this hash. The test
  # `test_rendered_template_source_modules_are_hash_dependencies` checks the modules.
  platform/portal:
    depends_on:
      - common/observability/portal_apps.py
      - common/observability/probe_specs.py
      - common/core/registry.py
      - common/core/constants.py
      - platform/11.signoz/deploy.py
      - finance_report/finance_report/*/deploy.py
      - truealpha/truealpha/*/deploy.py
      - finance_report/finance_report/observability/dashboard.json
      - truealpha/truealpha/observability/dashboard.json

  platform/todo:
    depends_on:
      - uv.lock
      - tools/sdk_requirement.py
      # The Preview compose builds the slot's own S3 from this Dockerfile (#1647).
      - platform/03.s3/Dockerfile

  bootstrap/iac-runner:
    depends_on:
      - uv.lock
      - tools/sdk_requirement.py
