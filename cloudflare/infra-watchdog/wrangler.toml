name = "infra2-cloudflare-watchdog"
main = "worker.js"
compatibility_date = "2026-06-01"
account_id = "6e27b6853de0131bea033d235e0a1139"
workers_dev = true

# Persist console.log output as queryable Workers Logs (free-tier allocation),
# so watchdog/heartbeat failures are diagnosable after the fact instead of only
# via live `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/30 * * * *"]

[vars]
WATCHDOG_ENVIRONMENTS = "production,staging"
WATCHDOG_HTTP_TIMEOUT_MS = "8000"
# One GET per entrypoint per run, no in-run retry: an entrypoint pages after this
# many consecutive failing runs (2 runs = 30-60 min at the 30-minute cron).
WATCHDOG_ENTRYPOINT_FAILURE_RUNS = "2"
# A still-active alert is re-sent at most this often (6 h).
WATCHDOG_RENOTIFY_SECONDS = "21600"
WATCHDOG_STATUS_MAX_AGE_SECONDS = "7200"
# KV free tier: 1000 put()/day for the whole account (#904 budget: <= 200/day).
# Worst-case daily puts =
#   heartbeat keys * (ceil(86400 / MIN_WRITE_INTERVAL) + STATUS_CHANGE_WRITES_PER_DAY)
#   + 48 cron runs * 1 (the state document on a transition, else the last-run record)
#   = 2 * (48 + 24) + 48 = 192; healthy steady state 2 * 48 + 48 = 144.
# Only configured heartbeat keys are stored, and a runner's liveness ping never
# changes the stored verdict (2026-09-15: that alternation wrote on every post).
# A 1800 s refresh still keeps a live runner's record far below maxAgeSeconds 5400.
WATCHDOG_HEARTBEAT_MIN_WRITE_INTERVAL_SECONDS = "1800"
WATCHDOG_HEARTBEAT_STATUS_CHANGE_WRITES_PER_DAY = "24"
ALERT_DELIVERY_MODE = "feishu_app"
# Secondary alert channel (email via Resend): used only when Feishu delivery
# fails, so a Feishu outage cannot silently swallow an alert. RESEND_API_KEY is a
# wrangler secret. Sender domain must be verified in Resend.
ALERT_EMAIL_TO = "wangzitian.ai@gmail.com"
ALERT_EMAIL_FROM = "watchdog@mail.zitian.party"
# One external entrypoint per product (#904). Every other public route is probed
# in-band by the VPS (PublicRouteFacet -> PUBLIC_ROUTE_PROBE_SPECS), which pages it.
WATCHDOG_TARGETS_JSON = """
[
  {"environment":"production","name":"dokploy-public-route","service_id":"bootstrap/dokploy","url":"https://cloud.zitian.party","statuses":[200,302],"severity":"critical"},
  {"environment":"production","name":"finance-report-web-public-route","service_id":"finance_report/app","url":"https://report.zitian.party/","statuses":[200,302,307,308],"severity":"critical"},
  {"environment":"production","name":"truealpha-web-public-route","service_id":"truealpha/app","url":"https://truealpha.club/","statuses":[200,302,307,308],"severity":"critical"}
]
"""
# Production pages; staging is recorded for /status only.
WATCHDOG_HEARTBEATS_JSON = """
[
  {"environment":"production","name":"platform-alerting-probes","service_id":"platform/alerting","maxAgeSeconds":5400,"severity":"critical"},
  {"environment":"staging","name":"platform-alerting-probes-staging","service_id":"platform/alerting","maxAgeSeconds":5400,"severity":"warning"}
]
"""

[[kv_namespaces]]
binding = "WATCHDOG_STATE"
id = "2b2eebc2a53c475797f92269e4d96248"
preview_id = "64cb09c404f242d28dfb8861b3b63899"
