# infra2 SSH hardening drop-in (#724-R2).
# Installed to /etc/ssh/sshd_config.d/10-infra2-hardening.conf by configure_ssh_fail2ban.sh.
# Enforces key-only authentication and disables password / keyboard-interactive logins (O1).
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
MaxAuthTries 4
