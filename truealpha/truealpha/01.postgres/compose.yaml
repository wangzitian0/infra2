# truealpha Postgres on x-infra2 (#1822 Slice 3). common/deploy/compose_compile.py compiles
# this file with infra2-sdk `compile_compose`, and the deploy uploads the compiled text as
# Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print truealpha/truealpha/01.postgres/compose.yaml
x-infra2:
  # One vault-agent sidecar, container truealpha-postgres-vault-agent${ENV_SUFFIX}. Its
  # template is rendered from env.manifest.json (common.security.secrets_render).
  vault:
    name: truealpha-postgres

services:
  postgres:
    mem_limit: 4g
    image: postgres:16-alpine
    container_name: truealpha-postgres${ENV_SUFFIX}
    # x-vault waits for /secrets/.env, exports it, then runs this command. POSTGRES_PASSWORD
    # comes from that file; it is never compose env, so Dokploy never stores it.
    x-vault: {}
    command: ["docker-entrypoint.sh", "postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: truealpha
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d truealpha" ]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ${DATA_PATH}:/var/lib/postgresql/data
    # Host-loopback publish for the host-side ingestion runtime: moomoo OpenD listens
    # only on the host 127.0.0.1, and the host cannot route into dokploy-network.
    # deploy.py injects a per-env port (staging 15432, production 15433).
    ports:
      - "${TA_POSTGRES_HOST_PORT:-127.0.0.1:0}:5432"
    labels:
      - "traefik.enable=false"
