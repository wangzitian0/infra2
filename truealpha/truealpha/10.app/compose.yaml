# TrueAlpha app (web + llm): hand-written file in the compiled x-infra2 shape (#1822 Slice 3,
# step A). Deploy: deploy_v2(service="truealpha/app") -> common.deploy.promote, with the
# image tag ${IMAGE_TAG} that the truealpha repo CI pushes to GHCR.
# llm and web equal their compiled x-vault services: the SDK wait entrypoint exports
# /secrets/.env, then runs `command`. The llm command applies db/migrations before uvicorn
# starts, and stops on a migration failure.
# The vault-agent sidecar keeps its mounted config and template; the promote path can set
# VAULT_SECRETS_TEMPLATE (base64 of the release template), which the entrypoint decodes.
# The next step swaps only the sidecar to the compiled one.
services:
  vault-agent:
    init: true
    image: hashicorp/vault:1.15
    container_name: truealpha-app-vault-agent${ENV_SUFFIX}
    restart: always
    mem_limit: 128m
    cpu_shares: 256
    entrypoint:
    - sh
    - -c
    - |
      rm -f /vault/secrets/.env /vault/.token /vault/role_id /vault/secret_id 2>/dev/null || true
      if [ -z "$$VAULT_ROLE_ID" ] || [ -z "$$VAULT_SECRET_ID" ]; then
        echo "VAULT_ROLE_ID and VAULT_SECRET_ID are required"
        exit 1
      fi
      if [ -z "$$VAULT_ADDR" ]; then
        echo "VAULT_ADDR is required"
        exit 1
      fi
      echo "$$VAULT_ROLE_ID" > /vault/role_id
      echo "$$VAULT_SECRET_ID" > /vault/secret_id
      if [ -n "$$VAULT_SECRETS_TEMPLATE" ]; then
        printf '%s' "$$VAULT_SECRETS_TEMPLATE" | base64 -d > /vault/secrets.ctmpl && [ -s /vault/secrets.ctmpl ] || { echo "CRITICAL: invalid VAULT_SECRETS_TEMPLATE"; exit 1; }
        sed 's|/etc/vault/secrets.ctmpl|/vault/secrets.ctmpl|g' /etc/vault/vault-agent.hcl > /vault/vault-agent.hcl
        exec vault agent -config=/vault/vault-agent.hcl
      fi
      # AppRole auto_auth: vault-agent logs in and renews/re-auths the token
      # natively. No token_file decay, no manual renew loop.
      exec vault agent -config=/etc/vault/vault-agent.hcl
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_SECRETS_TEMPLATE: ${VAULT_SECRETS_TEMPLATE:-}
      ENV: ${ENV}
      ENV_SUFFIX: ${ENV_SUFFIX:-}
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
    healthcheck:
      test:
      - CMD-SHELL
      - |
        test -s /vault/secrets/.env && ! grep -q "<no value>" /vault/secrets/.env && test -s /vault/.token || exit 1
        # vault token lookup THROTTLED to ~5min (token TTL is hours) — no 30s hammer (#292)
        if [ -z "$$(find /tmp/.vault_hc -mmin -5 2>/dev/null)" ]; then
          wget -q -T 3 --header="X-Vault-Token: $$(cat /vault/.token)" "$$VAULT_ADDR/v1/auth/token/lookup-self" -O /dev/null || exit 1
          touch /tmp/.vault_hc
        fi
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
    - ./vault-agent.hcl:/etc/vault/vault-agent.hcl:ro
    - ./secrets.ctmpl:/etc/vault/secrets.ctmpl:ro
    - secrets:/vault/secrets
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    networks:
    - dokploy-network
  llm:
    image: ghcr.io/wangzitian0/truealpha-llm-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: truealpha-llm${ENV_SUFFIX}
    restart: always
    mem_limit: 512m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    depends_on:
      vault-agent:
        condition: service_healthy
    command:
    - sh
    - -c
    - |
      # Apply db/migrations/*.sql + db/roles.sql (baked into the image, #428) against
      # this env's DATABASE_URL before serving. Idempotent SQL, safe on every boot.
      # A separate line (no &&) would let a migration failure silently fall through
      # to `exec uvicorn` anyway — explicit exit so a broken schema fails closed.
      sh ./db/apply_migrations.sh || exit 1
      exec uvicorn llm_service.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120
    environment:
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      ENVIRONMENT: ${ENV}
      NODE_ENV: production
      S3_ENDPOINT: http://platform-s3${ENV_SUFFIX}:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-signoz-otel-collector:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      start_period: 120s
      start_interval: 2s
      interval: 10s
      retries: 3
      timeout: 5s
    volumes:
    - secrets:/secrets:ro
    networks:
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`) && (PathPrefix(`/api/mcp`) || Path(`/api/health`))
    - traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.entrypoints=websecure
    - traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt
    - traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.service=truealpha-api${ENV_DOMAIN_SUFFIX}
    - traefik.http.services.truealpha-api${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=8000
    - traefik.http.middlewares.truealpha-api-strip${ENV_DOMAIN_SUFFIX}.stripprefix.prefixes=/api
    - traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.middlewares=truealpha-api-strip${ENV_DOMAIN_SUFFIX}@docker
    - traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`) && PathPrefix(`/api/v1`)
    - traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.entrypoints=websecure
    - traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt
    - traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.service=truealpha-api${ENV_DOMAIN_SUFFIX}
    - traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.priority=20
    entrypoint:
    - sh
    - -c
    - |
      set -e
      waited=0
      max_wait="300"
      while [ ! -s /secrets/.env ] && [ "$$waited" -lt "$$max_wait" ]; do
        echo "Waiting for secrets file..."
        sleep 2
        waited=$$((waited + 2))
      done
      if [ ! -s /secrets/.env ]; then
        echo "ERROR: /secrets/.env is missing or empty"
        exit 1
      fi
      set -a
      . /secrets/.env
      set +a
      exec "$$@"
    - --
  web:
    image: ghcr.io/wangzitian0/truealpha-app-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: truealpha-web${ENV_SUFFIX}
    restart: always
    mem_limit: 512m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    depends_on:
      vault-agent:
        condition: service_healthy
    command:
    - node
    - server.js
    environment:
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      ENVIRONMENT: ${ENV}
      LLM_SERVICE_URL: http://truealpha-llm${ENV_SUFFIX}:8000
      NODE_ENV: production
      S3_ENDPOINT: http://platform-s3${ENV_SUFFIX}:9000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${APP_HOST}}
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: ${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      OPENPANEL_ENVIRONMENT: ${OPENPANEL_ENVIRONMENT:-${ENV}}
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -T
      - '3'
      - -O
      - /dev/null
      - http://127.0.0.1:3000
      start_period: 30s
      start_interval: 2s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
    - secrets:/secrets:ro
    networks:
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`)
    - traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.entrypoints=websecure
    - traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt
    - traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.service=truealpha-web${ENV_DOMAIN_SUFFIX}
    - traefik.http.services.truealpha-web${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=3000
    - traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.priority=1
    entrypoint:
    - sh
    - -c
    - |
      set -e
      waited=0
      max_wait="300"
      while [ ! -s /secrets/.env ] && [ "$$waited" -lt "$$max_wait" ]; do
        echo "Waiting for secrets file..."
        sleep 2
        waited=$$((waited + 2))
      done
      if [ ! -s /secrets/.env ]; then
        echo "ERROR: /secrets/.env is missing or empty"
        exit 1
      fi
      set -a
      . /secrets/.env
      set +a
      exec "$$@"
    - --
volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m,mode=0755
networks:
  dokploy-network:
    external: true
