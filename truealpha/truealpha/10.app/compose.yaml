# TrueAlpha Application (web + llm)
#
# v2 deploy model: fixed-compose promotion via deploy_v2(service="truealpha/app", ...)
# -> common.deploy.promote. Images are built and pushed to GHCR by the truealpha app
# repo's CI; Dokploy compose pulls pinned ${IMAGE_TAG}. Fast-swap short promote enabled
# on staging.
#
# The app repo owns the DB schema DDL (db/migrations, idempotent SQL) — see
# ../01.postgres/README.md for the bootstrap command.
#
# The deploy compiles this file with infra2-sdk `compile_compose` (#1822 Slice 3) and
# uploads the compiled text as Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print truealpha/truealpha/10.app/compose.yaml
x-infra2:
  # One vault-agent sidecar, container truealpha-app-vault-agent${ENV_SUFFIX}. Its
  # template is rendered from env.manifest.json (common.security.secrets_render). The
  # deploy stops when the release template differs (common.deploy.promote).
  vault:
    name: truealpha-app

services:
  llm:
    image: ghcr.io/wangzitian0/truealpha-llm-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: truealpha-llm${ENV_SUFFIX}
    restart: always
    mem_limit: 512m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      vault-agent:
        condition: service_healthy
    # x-vault waits for /secrets/.env, exports it, then runs this command.
    x-vault: {}
    command:
      - sh
      - -c
      - |
        # Apply db/migrations/*.sql + db/roles.sql (baked into the image, #428) against
        # this env's DATABASE_URL before serving. Idempotent SQL, safe on every boot.
        # A separate line (no &&) would let a migration failure silently fall through
        # to `exec uvicorn` anyway — explicit exit so a broken schema fails closed.
        sh ./db/apply_migrations.sh || exit 1
        exec uvicorn llm_service.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      # Was defaulted by the hand-written secrets.ctmpl; the generated template renders
      # only human / runtime values, so the deployment states these here.
      ENVIRONMENT: ${ENV}
      NODE_ENV: production
      S3_ENDPOINT: http://platform-s3${ENV_SUFFIX}:9000
      # Telemetry (infra2#906, docs/ssot/ops.observability.md 4.2). The endpoint is the ONE
      # shared collector: no ${ENV_SUFFIX}, reachable only on dokploy-network. Identity is
      # issued by the deployment (common.service_identity, every deploy path), never defaulted
      # here: the service refuses to start when export is on without it, and the issued
      # value is what separates production / staging / pr-<N> in SigNoz. llm is the only
      # service that gets these -- web is Node with no OTel SDK, and one compose-level
      # OTEL_SERVICE_NAME cannot name two services (finance_report's backend-only precedent).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-signoz-otel-collector:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      # python stdlib probe: the uv-based slim image ships no curl/wget.
      # 127.0.0.1, not localhost: alpine/slim images often resolve localhost to
      # ::1 first, and the server only listens on IPv4 -> spurious refused conns.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      # The entrypoint applies the schema before it serves (db/apply_migrations.sh).
      # The replay took 22 s to 27 s of the boot, and a busy host made one boot 69 s
      # (truealpha#1513). Docker counts no failed check inside the start period.
      # 120 s is the start period that infra2_sdk.scaffold gives an app with a Vault
      # sidecar. common/tests/test_truealpha_app.py reads that value from the SDK.
      start_period: 120s
      start_interval: 2s
      interval: 10s
      retries: 3
      timeout: 5s
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Scoped to exactly what this FastAPI app serves (main.py: GET /health, and
      # the MCP app mounted at /mcp) -- NOT a bare PathPrefix(`/api`). The web
      # service's own Next.js API routes (/api/auth/login, /api/auth/me, ...) live
      # under the same /api prefix on the same Host, and a bare PathPrefix(`/api`)
      # here claims those too, silently 404ing them at llm instead of ever reaching
      # web (truealpha#463 -- login was broken on both envs for this exact reason).
      # Host uses ${APP_HOST} (deploy.py-computed), not the literal
      # truealpha${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN} pattern -- that pattern
      # collapsed to the malformed truealpha.truealpha.club in production, since
      # INTERNAL_DOMAIN is already truealpha.club here (see truealpha#474).
      - "traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`) && (PathPrefix(`/api/mcp`) || Path(`/api/health`))"
      - "traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.service=truealpha-api${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.truealpha-api${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=8000"
      # Strip /api prefix before forwarding to the llm-service
      - "traefik.http.middlewares.truealpha-api-strip${ENV_DOMAIN_SUFFIX}.stripprefix.prefixes=/api"
      - "traefik.http.routers.truealpha-api${ENV_DOMAIN_SUFFIX}.middlewares=truealpha-api-strip${ENV_DOMAIN_SUFFIX}@docker"
      # Route /api/v1/* directly to FastAPI OpenAPI v1 handlers without stripping /api (truealpha#1716).
      - "traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.service=truealpha-api${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.routers.truealpha-v1${ENV_DOMAIN_SUFFIX}.priority=20"

  web:
    image: ghcr.io/wangzitian0/truealpha-app-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: truealpha-web${ENV_SUFFIX}
    restart: always
    mem_limit: 512m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      llm:
        condition: service_healthy
    # Zero-DB web frontend: calls llm over LLM_SERVICE_URL; requires no Vault secrets or direct Postgres access.
    command:
      - node
      - server.js
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      # Cache-bust (the deploy sets CONFIGURATION_SHA256): without this,
      # web is never recreated on a same-tag promote deploy (GIT_COMMIT_SHA alone
      # doesn't change between two deploys of the same release).
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      # Was defaulted by the hand-written secrets.ctmpl; the generated template renders
      # only human / runtime values, so the deployment states these here.
      ENVIRONMENT: ${ENV}
      # The app-web origin resolver reads it (truealpha v0.2.132); no fixed host.
      LLM_SERVICE_URL: http://truealpha-llm${ENV_SUFFIX}:8000
      NODE_ENV: production
      S3_ENDPOINT: http://platform-s3${ENV_SUFFIX}:9000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${APP_HOST}}
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: ${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      OPENPANEL_ENVIRONMENT: ${OPENPANEL_ENVIRONMENT:-${ENV}}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      # busybox wget ships with the alpine runtime image. 127.0.0.1, not
      # localhost: busybox wget doesn't fall back across address families, and
      # alpine resolves localhost to ::1 first while node only listens on IPv4.
      test: [ "CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3000" ]
      start_period: 30s
      start_interval: 2s
      interval: 30s
      retries: 5
      timeout: 10s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # See the llm router's comment above (truealpha#474) -- ${APP_HOST}, not the
      # literal truealpha${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN} pattern.
      - "traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.service=truealpha-web${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.truealpha-web${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=3000"
      # Lower priority than the /api route
      - "traefik.http.routers.truealpha-web${ENV_DOMAIN_SUFFIX}.priority=1"

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
