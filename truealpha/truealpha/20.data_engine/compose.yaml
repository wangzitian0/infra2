# TrueAlpha data engine (Dagster). Deploy: deploy_v2(service="truealpha/data_engine").
#
# The deploy compiles this file with infra2-sdk `compile_compose` (#1822 Slice 3) and
# uploads the compiled text as Dokploy sourceType=raw. To read the compiled text:
#   python -m tools.compose_compile print truealpha/truealpha/20.data_engine/compose.yaml
# Each Dagster service has `x-vault`: the compiled wait entrypoint exports /secrets/.env,
# then runs `command`. The command runs /app/dagster-entrypoint.sh from the image
# (truealpha#1866, v0.2.144), which sets DAGSTER_POSTGRES_URL, validates the boot
# environment, and runs the role.
x-infra2:
  # One vault-agent sidecar, container truealpha-data-engine-vault-agent${ENV_SUFFIX}.
  # Its template is rendered from env.manifest.json (common.security.secrets_render).
  vault:
    name: truealpha-data-engine
    # The template builds DATABASE_URL with `env "TA_POSTGRES_PORT"`. `env "X"` reads the
    # sidecar's own environment, so the sidecar gets this name (x-infra2.vault.env); the
    # compile stops when the template reads a name that the sidecar does not get.
    env: [TA_POSTGRES_PORT]

# Fail closed when IMAGE_DIGEST, RELEASE_ID, CONFIGURATION_SHA256, or CAPTURE_APPROVED_BY is unset.
x-dagster-service: &dagster-service
  image: ghcr.io/wangzitian0/truealpha-data-engine@${IMAGE_DIGEST:?IMAGE_DIGEST is required}
  pull_policy: always
  restart: always
  # One ceiling for staging and production: staging rehearses the production run mix.
  # 768m in staging let the kernel kill the code server five times on 2026-10-20, and
  # every run in it died (truealpha#1467). Production peaked at 590 MB of 1536m.
  mem_limit: 1536m
  cpu_shares: ${TIER_CPU_SHARES:-1024}
  depends_on:
    vault-agent:
      condition: service_healthy
  environment: &dagster-env
    ENVIRONMENT: ${ENV}
    # Host-loopback MinIO (#602); was derived inside the hand-written secrets.ctmpl.
    S3_ENDPOINT: http://127.0.0.1:${TA_MINIO_S3_PORT}
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    MOOMOO_OPEND_HOST: 127.0.0.1
    MOOMOO_OPEND_PORT: "11111"
    # truealpha#854: moomoo as a governed origin (third price origin, second financial
    # origin) is feature-flagged in the engine; the flags are per-environment IaC
    # (deploy.py::_release_recomputable_env): enabled in staging and production
    # (soaked on staging, proven in truealpha#874, and enabled in production via #854 / #874).
    # Any other environment name stays off.
    MOOMOO_KLINE_ORIGIN_ENABLED: ${MOOMOO_KLINE_ORIGIN_ENABLED:-false}
    MOOMOO_FINANCIALS_ORIGIN_ENABLED: ${MOOMOO_FINANCIALS_ORIGIN_ENABLED:-false}
    RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
    IMAGE_DIGEST: ${IMAGE_DIGEST:?IMAGE_DIGEST is required}
    CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:?CONFIGURATION_SHA256 is required}
    CAPTURE_APPROVED_BY: ${CAPTURE_APPROVED_BY:?CAPTURE_APPROVED_BY is required}
    # Host-loopback OTLP HTTP collector (#1231): network_mode: host cannot resolve
    # platform-signoz-otel-collector on dokploy-network, so platform/11.signoz
    # publishes 127.0.0.1:14318 -> 4318 on the host loopback.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:14318
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  volumes:
    - secrets:/secrets:ro
    - ${DATA_PATH}:/var/lib/dagster
  # OpenD deliberately listens only on host 127.0.0.1. Host networking reaches
  # that boundary without publishing OpenD or adding a bridge-facing proxy.
  network_mode: host
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "traefik.enable=false"

services:
  # Persistent code-server role: webserver/daemon point at this
  # long-lived process via --grpc-socket instead of each spawning + heartbeat-
  # managing (20s TTL) their own local code-server subprocess, which was self-
  # terminating and respawning roughly every 68-70s under normal operation
  # (dagster._daemon.controller.DAEMON_GRPC_SERVER_HEARTBEAT_TTL = 20; harmless
  # so far per dagster.job_ticks -- 13/13 SUCCESS across the churn -- but wasteful
  # churn and a needlessly tight safety margin for an always-on deployment).
  dagster-code-server:
    <<: *dagster-service
    container_name: truealpha-dagster-code-server${ENV_SUFFIX}
    # x-vault waits for /secrets/.env, exports it, then runs this command.
    x-vault: {}
    command:
      - /bin/sh
      - /app/dagster-entrypoint.sh
      - dagster
      - api
      - grpc
      - -m
      - data_engine.dagster_defs
      - --socket
      - /var/lib/dagster/code-server.sock
      - --lazy-load-user-code
      - --location-name
      - data_engine.dagster_defs
      - --log-level
      - warning
    healthcheck:
      # `dagster api grpc-health-check` is a full CLI cold start — it imports dagster and
      # the workspace and costs 10–11 s of CPU per check on the shared host (measured
      # 2026-09-07: interval 30 s, timeout 10 s, so under load every check timed out,
      # both code servers sat `unhealthy` with a failing streak, and the checks alone
      # burned about a core while making the load they then failed on — the same shape
      # #616/#619 removed from the daemon). This probe connects to the gRPC unix socket
      # with bare Python (no dagster import, ~50 ms): the server is up and accepting.
      # Whether the code server can LOAD the definitions is the daemon's and the
      # webserver's business, which they report through their own probes.
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/var/lib/dagster/code-server.sock'); s.close()"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  dagster-daemon:
    <<: *dagster-service
    container_name: truealpha-dagster-daemon${ENV_SUFFIX}
    depends_on:
      vault-agent:
        condition: service_healthy
      dagster-code-server:
        condition: service_healthy
    x-vault: {}
    command: ["/bin/sh", "/app/dagster-entrypoint.sh", "dagster-daemon", "run", "--grpc-socket", "/var/lib/dagster/code-server.sock"]
    healthcheck:
      # `dagster-daemon liveness-check` is a full CLI cold start — under host load
      # (LA 8-10 measured) the import alone exceeds the 10s budget, and the daemon
      # sat "unhealthy" for 8 straight days while its sensor ticked every 30s
      # (truealpha#616 evidence). The probe now asks the question directly: has
      # ANY daemon heartbeat landed in the last 5 minutes? ~1s in-container,
      # load-immune, and it measures the daemon's actual output instead of the
      # CLI's startup time.
      test:
        - CMD-SHELL
        - set -a; . /secrets/.env; set +a; python -c "import os, sys, psycopg;
          c = psycopg.connect(os.environ['DATABASE_URL'], options='-csearch_path=dagster', connect_timeout=5);
          row = c.execute(\"select count(*) from daemon_heartbeats where timestamp > (now() at time zone 'utc') - interval '5 minutes'\").fetchone();
          c.close(); sys.exit(0 if row[0] > 0 else 1)"
      # 2.5s measured warm in the live container; the budget is sized for the
      # LA 8-10 spikes that killed the old CLI probe, not the happy path. A
      # heartbeat window of 5 minutes makes sub-minute polling pointless anyway.
      # retries 3, not 5 (review on #620): enough to ride out a vault-agent
      # secret rotation, while a dead daemon flips unhealthy in ~8 minutes
      # (5-minute window + 3 failed checks) instead of ~10.
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
