[project]
name = "infra2"
version = "0.1.0"
description = "Infrastructure as Code for self-hosted services"
requires-python = ">=3.11"
dependencies = [
    # Cross-repository wire/data contracts. Pin the immutable release artifact;
    # workspace submodules are never runtime dependencies. NOTE: keep this exact
    # "infra2-sdk @ " prefix — ops-checks.yml's deploy-v2-canary job and
    # test_deploy_canary_installs_the_declared_sdk_requirement extract this
    # entry by an exact startswith("infra2-sdk @ ") match; an extras suffix
    # (e.g. "infra2-sdk[foo] @ ") would silently stop matching and crash that
    # job's dependency install. psycopg/boto3 are declared as their own plain
    # entries below instead of via SDK extras for exactly this reason.
    "infra2-sdk @ https://github.com/wangzitian0/infra2-sdk/releases/download/v1.0.0/infra2_sdk-1.0.0-py3-none-any.whl",
    # libs/tests unit testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.0",
    # Automation
    "invoke>=2.2.0",
    "rich>=14.2.0",
    # tools/infra_probe_runner.py real postgres/s3 protocol probes (kind="postgres"/"s3"
    # in libs/infra_probes.py) call infra2_sdk.runtime.postgres/s3, which need these.
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34,<2",
]

[dependency-groups]
# e2e_regressions/ is a manual/local-only suite (no CI workflow runs it) — kept out
# of the default `uv sync`/`uv run` install so the infra-ci unit-test job doesn't pay
# for deps it never imports. Run with `uv run --group e2e pytest e2e_regressions`.
e2e = [
    "playwright>=1.40.0",
    "asyncpg>=0.29.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs/tests", "e2e_regressions/tests"]
markers = [
    "smoke: quick smoke tests",
    "sso: SSO/Portal tests",
    "platform: Platform service tests",
    "api: API endpoint tests",
    "database: Database connection tests",
    "e2e: full end-to-end tests",
]

[tool.coverage.run]
source = ["libs", "tools"]
omit = [
    "libs/tests/**",
    "e2e_regressions/tests/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.setuptools.packages.find]
where = ["."]
include = ["e2e_regressions*"]
exclude = ["bootstrap*", "docs*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
