name: App tool caches
description: Restore the Playwright browsers and the bun cache that the App hook bootstrap installs (#1843). `warm` also fills a missing cache and saves it.

inputs:
  warm:
    description: "Install the tools on a cache miss and save the cache. Only a run on main saves a cache that a tag run can restore."
    required: false
    default: "false"

outputs:
  browsers-hit:
    description: "Whether the Playwright browsers cache was restored."
    value: ${{ steps.browsers.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The key is the hash of each App lockfile at the pinned `release_tag` from `harness/repos.yaml`.
    # When a file cannot be read, the key holds the run id so the cache misses.
    - name: Fingerprint App lockfiles
      id: keys
      shell: bash
      run: |
        set -uo pipefail
        resolve_ref() {
          local repo="$1"
          awk -v target="repos/${repo}" '
            /^[[:space:]]*- id:/ {
              if (cur_path == target && cur_tag != "") { print cur_tag; found=1; exit }
              cur_tag=""; cur_path=""
            }
            $1 == "path:" { gsub(/["'\'']/, "", $2); cur_path=$2 }
            $1 == "release_tag:" { gsub(/["'\'']/, "", $2); cur_tag=$2 }
            END { if (!found && cur_path == target && cur_tag != "") print cur_tag }
          ' harness/repos.yaml
        }
        fp() {
          local repo="$1" path="$2" ref="$3" body
          if [[ -n "$ref" ]] && body="$(curl -fsSL --retry 3 --max-time 30 \
              "https://raw.githubusercontent.com/wangzitian0/${repo}/${ref}/${path}")"; then
            printf '%s' "$body" | sha256sum | cut -c1-16
          else
            echo "unknown-${GITHUB_RUN_ID}"
          fi
        }
        ta_ref="$(resolve_ref truealpha)"
        fr_ref="$(resolve_ref finance_report)"
        {
          echo "ta_ref=${ta_ref}"
          echo "fr_ref=${fr_ref}"
          echo "truealpha=$(fp truealpha apps/app-web/bun.lock "$ta_ref")"
          echo "finance=$(fp finance_report tests/e2e/requirements.txt "$fr_ref")"
        } >> "$GITHUB_OUTPUT"

    # Each action is fixed to a commit SHA because the job env of `post` holds secrets.
    - name: Restore Playwright browsers
      id: browsers
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-ta-${{ steps.keys.outputs.truealpha }}-fr-${{ steps.keys.outputs.finance }}

    - name: Restore bun cache
      id: bun
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-ta-${{ steps.keys.outputs.truealpha }}

    # The same commands as the bootstrap of each App manifest, run in a scratch directory
    # that holds only the manifest and the lockfile.
    - name: Fill the caches
      if: ${{ inputs.warm == 'true' && (steps.browsers.outputs.cache-hit != 'true' || steps.bun.outputs.cache-hit != 'true') && !startsWith(steps.keys.outputs.truealpha, 'unknown') && !startsWith(steps.keys.outputs.finance, 'unknown') }}
      shell: bash
      env:
        TA_REF: ${{ steps.keys.outputs.ta_ref }}
        FR_REF: ${{ steps.keys.outputs.fr_ref }}
      run: |
        set -euo pipefail
        base="https://raw.githubusercontent.com/wangzitian0"
        ta_ref="${TA_REF}"
        fr_ref="${FR_REF}"
        work="$(mktemp -d)"
        mkdir -p "$work/ta" "$work/fr"
        curl -fsSL --retry 3 -o "$work/ta/package.json" "$base/truealpha/${ta_ref}/apps/app-web/package.json"
        curl -fsSL --retry 3 -o "$work/ta/bun.lock" "$base/truealpha/${ta_ref}/apps/app-web/bun.lock"
        (cd "$work/ta" && bun install --frozen-lockfile && bunx playwright install --only-shell chromium)
        curl -fsSL --retry 3 -o "$work/fr/requirements.txt" "$base/finance_report/${fr_ref}/tests/e2e/requirements.txt"
        uv venv "$work/fr/venv" --quiet
        uv pip install --python "$work/fr/venv/bin/python" --quiet -r "$work/fr/requirements.txt"
        "$work/fr/venv/bin/playwright" install chromium

    - name: Save Playwright browsers
      if: ${{ inputs.warm == 'true' && steps.browsers.outputs.cache-hit != 'true' && !startsWith(steps.keys.outputs.truealpha, 'unknown') && !startsWith(steps.keys.outputs.finance, 'unknown') }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-ta-${{ steps.keys.outputs.truealpha }}-fr-${{ steps.keys.outputs.finance }}

    - name: Save bun cache
      if: ${{ inputs.warm == 'true' && steps.bun.outputs.cache-hit != 'true' && !startsWith(steps.keys.outputs.truealpha, 'unknown') }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-ta-${{ steps.keys.outputs.truealpha }}
