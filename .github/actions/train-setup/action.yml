name: Train setup
description: Python, uv and the runtime dependencies of the release train; the three jobs of reconcile-iac-inputs.yml use it (#1646).

inputs:
  bun:
    description: "Install bun. The truealpha hook slots run `bun install` and `bunx playwright` (#1603)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Pinned to the .python-version file of the checkout.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # A hook step must not change the runner system, so the job installs bun (#1603).
    # The action ref is a commit SHA, not a tag, because the job env holds secrets.
    - name: Install bun
      if: ${{ inputs.bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"

    - name: Install runtime dependencies
      shell: bash
      run: uv pip install --system invoke httpx python-dotenv pyyaml rich "$(python tools/sdk_requirement.py)"

    # A tag-push checkout has the full history (fetch-depth: 0) but no origin/main
    # remote-tracking ref. The provenance guard (assert_after_on_main) refuses any tag
    # not reachable from origin/main, so make that ref resolvable here.
    - name: Fetch origin/main for the provenance guard
      shell: bash
      run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
