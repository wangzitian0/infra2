name: App deploy request

# Cross-repository receiver for the infra2-sdk DeployRequest v1 contract. Applications
# request a deployment; infra2 verifies Production evidence and alone executes deploy_v2.
#
# infra2#537: without an explicit run-name, a repository_dispatch run's display_title
# defaults to the workflow name ("App deploy request") — but every sender (e.g.
# truealpha's deploy-release.yml) polls this repo's Actions API for a run whose
# display_title equals `Deploy <service> <deploy_type> <version_ref> <source_sha>
# [<request_id>]` to confirm receipt. Without this match the sender's poll loop always
# times out, even on a fully successful receiver run. This run-name reproduces that
# exact string from the dispatch payload so the match can succeed.
run-name: Deploy ${{ github.event.client_payload.service }} ${{ github.event.client_payload.deploy_type }} ${{ github.event.client_payload.version_ref }} ${{ github.event.client_payload.source_sha }} [${{ github.event.client_payload.request_id }}]
on:
  repository_dispatch:
    types: [app-deploy-request]

permissions:
  actions: read
  contents: read

concurrency:
  group: app-deploy-${{ github.event.client_payload.service }}-${{ github.event.client_payload.deploy_type }}
  cancel-in-progress: false

env:
  APP_DEPLOY_REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
  APP_DEPLOY_REQUEST_SENDER: ${{ github.event.sender.login }}
  GITHUB_TOKEN: ${{ github.token }}
  INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
  # Each line reaches the step log when it is printed, so a deploy phase's duration is
  # read off the log's timestamps instead of reconstructed from other logs (truealpha#860).
  PYTHONUNBUFFERED: "1"

# Job shape (truealpha#860). A job pays its own runner, checkout and install (~17 s), so
# each job below exists for one reason only:
#   - preflight_canary is its own job because the pr-999 canary lock can only be
#     held by a whole job, and it must cover the canary alone, not the promote.
#     It runs for production requests only (DeployPlan.requires_preflight_canary).
#   - deploy validates and executes in one job. A staging request runs this job alone.
# Credentials are scoped per step, not per job: every job validates the request in a step
# that holds no Dokploy or runner secret, and a secret appears only in the step after it.
jobs:
  preflight_canary:
    name: preflight requested artifact
    # Whether to canary is decided before any plan exists, so this pre-filter mirrors
    # DeployPlan.requires_preflight_canary (PREFLIGHT_CANARY_DEPLOY_TYPES) on the raw
    # payload. libs/tests/test_app_deploy_request_workflow.py pins the two to each other,
    # and both jobs re-check it against the validated plan (--require-preflight-canary
    # here, --preflight-canary-result in deploy), so a drift fails closed either way.
    if: >-
      ${{ github.event.client_payload.deploy_type == 'prod'
          && github.event.client_payload.operation != 'remove' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-v2-canary-pr-999
      queue: max
      cancel-in-progress: false
    outputs:
      iac_ref: ${{ steps.plan.outputs.iac_ref }}
    steps:
      - name: Checkout released infra context
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install receiver dependencies
        run: python -m pip install -e .
      - name: Validate and display the side-effect-free plan
        id: plan
        run: |
          set -euo pipefail
          plan="$(python -m tools.app_deploy_request plan \
            --sender "$APP_DEPLOY_REQUEST_SENDER" \
            --domain "$INTERNAL_DOMAIN" \
            --repo-root . \
            --require-preflight-canary)"
          printf '%s\n' "$plan" | python -m json.tool
          service="$(printf '%s' "$plan" | python -c 'import json,sys; print(json.load(sys.stdin)["request"]["service"])')"
          version_ref="$(printf '%s' "$plan" | python -c 'import json,sys; print(json.load(sys.stdin)["request"]["version_ref"])')"
          iac_ref="$(printf '%s' "$plan" | python -c 'import json,sys; print(json.load(sys.stdin)["iac_ref"])')"
          {
            echo "service=$service"
            echo "version_ref=$version_ref"
            echo "iac_ref=$iac_ref"
          } >> "$GITHUB_OUTPUT"
      - name: Canary the exact app and IaC coordinates
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          VALIDATED_SERVICE: ${{ steps.plan.outputs.service }}
          VALIDATED_VERSION_REF: ${{ steps.plan.outputs.version_ref }}
          VALIDATED_IAC_REF: ${{ steps.plan.outputs.iac_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            echo "::error::DOKPLOY_API_KEY is required for the deploy preflight."
            exit 1
          fi
          python -m tools.deploy_v2_canary \
            --service "$VALIDATED_SERVICE" \
            --version-ref "$VALIDATED_VERSION_REF" \
            --iac-ref "$VALIDATED_IAC_REF" \
            --domain "$INTERNAL_DOMAIN" \
            --timeout 600

  deploy:
    name: execute validated request
    needs: [preflight_canary]
    # !cancelled(), not always(): a cancelled run never starts a deploy. A skipped canary
    # (every non-production request) lets the deploy through; the plan step below refuses
    # it if the validated plan did require a canary.
    if: >-
      ${{ !cancelled()
          && (needs.preflight_canary.result == 'success'
              || needs.preflight_canary.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout released infra context
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install receiver dependencies
        run: python -m pip install -e .
      - name: Validate and display the side-effect-free plan
        id: plan
        env:
          PREFLIGHT_CANARY_RESULT: ${{ needs.preflight_canary.result }}
          # Empty when no canary ran; otherwise this checkout must still select the ref
          # the canary proved (a tag cut between the two checkouts fails here).
          CANARIED_IAC_REF: ${{ needs.preflight_canary.outputs.iac_ref }}
        run: |
          set -euo pipefail
          plan="$(python -m tools.app_deploy_request plan \
            --sender "$APP_DEPLOY_REQUEST_SENDER" \
            --domain "$INTERNAL_DOMAIN" \
            --repo-root . \
            --expected-iac-ref "$CANARIED_IAC_REF" \
            --preflight-canary-result "$PREFLIGHT_CANARY_RESULT")"
          printf '%s\n' "$plan" | python -m json.tool
          iac_ref="$(printf '%s' "$plan" | python -c 'import json,sys; print(json.load(sys.stdin)["iac_ref"])')"
          echo "iac_ref=$iac_ref" >> "$GITHUB_OUTPUT"
      - name: Configure SSH key for the pre-deploy schema gate
        # libs.deploy.schema_gate SSHes to the VPS to run pre_deploy_schema_check inside
        # the app's published image. Reuses INFRA2_WATCHDOG_SSH_* secrets (#802).
        env:
          INFRA2_WATCHDOG_SSH_PRIVATE_KEY: ${{ secrets.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${INFRA2_WATCHDOG_SSH_PRIVATE_KEY:-}" ]]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$INFRA2_WATCHDOG_SSH_PRIVATE_KEY" > ~/.ssh/infra2_schema_gate
            chmod 600 ~/.ssh/infra2_schema_gate
            echo "INFRA2_WATCHDOG_SSH_KEY_PATH=$HOME/.ssh/infra2_schema_gate" >> "$GITHUB_ENV"
          fi
      - name: Execute through deploy_v2
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          IAC_WEBHOOK_SECRET: ${{ secrets.IAC_WEBHOOK_SECRET }}
          IAC_RUNNER_URL: ${{ vars.IAC_RUNNER_URL || 'https://iac.zitian.party' }}
          PREFLIGHT_CANARY_RESULT: ${{ needs.preflight_canary.result }}
          VALIDATED_IAC_REF: ${{ steps.plan.outputs.iac_ref }}
          VPS_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
          INFRA2_WATCHDOG_SSH_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
          INFRA2_WATCHDOG_SSH_USER: ${{ secrets.INFRA2_WATCHDOG_SSH_USER }}
          INFRA2_WATCHDOG_SSH_PORT: ${{ vars.INFRA2_WATCHDOG_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            echo "::error::DOKPLOY_API_KEY is required to deploy an application."
            exit 1
          fi
          python -m tools.app_deploy_request execute \
            --sender "$APP_DEPLOY_REQUEST_SENDER" \
            --domain "$INTERNAL_DOMAIN" \
            --repo-root . \
            --expected-iac-ref "$VALIDATED_IAC_REF" \
            --preflight-canary-result "$PREFLIGHT_CANARY_RESULT"
