  facet-reconcile:
    # signal: facet-reconcile
    name: Daily facet reconcile (compose_id + config-hash + dns drift)
    # #542 task 4: ONE daily reality-vs-declaration reconcile absorbing the three
    # formerly separate drift jobs (app-compose-id-drift here, plus the deleted
    # config-drift-report.yml and dns-drift-report.yml workflows). Live check —
    # needs DOKPLOY_API_KEY (+ optional Cloudflare read creds), so scheduled +
    # manual only. The combined report is delivered EVERY run (self-proving, #425);
    # paging is confirmed-findings-only (#524) in the next step.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'facet-reconcile' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # #962: the page-dedup state, one issue per job (common/observability/page_dedup.py).
      issues: write
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      INFRA2_REPORTS_FEISHU_APP_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_ID }}
      INFRA2_REPORTS_FEISHU_APP_SECRET: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_SECRET }}
      INFRA2_REPORTS_FEISHU_CHAT_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      # #962: which sections really ran, for the step that resolves a paged finding.
      FACET_RECONCILE_OBSERVATION: ${{ github.workspace }}/facet-reconcile-observation.json
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout (full history — the config-hash section needs release tags + git cat-file at the tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          sdk_requirement="$(python tools/sdk_requirement.py)"
          python -m pip install --no-deps "$sdk_requirement"
          python -m pip install -e .

      - name: Run facet reconcile
        run: |
          set -euo pipefail
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            echo "::error::DOKPLOY_API_KEY secret is required for the facet reconcile."
            exit 1
          fi
          # READ-ONLY. Fails the STEP on ANY blocker (incl. a transient lookup
          # error, visible + retried tomorrow); pages only on confirmed findings
          # in the next step.
          python -m tools.facet_reconcile

      # #962: pages only when the set of confirmed findings changes (first appearance, one
      # added or removed, all resolved -> RESOLVED); the same set on a later day is a
      # `[报告] 仍未恢复 · 第 N 天` in the reports chat. Unreadable state pages as before.
      - name: Alert on confirmed findings
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.facet_reconcile import (
              confirmed_finding_pairs,
              run_all,
              unevaluated_prefixes,
          )
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          sections = run_all()
          pairs = confirmed_finding_pairs(sections)
          if not pairs:
              print("facet reconcile failed without confirmed findings "
                    "(transient) -- not paging.")
          detail = "\n".join(f"- {line}" for _key, line in pairs)
          outcome = dedup_page(
              os.environ,
              job="facet-reconcile",
              label="每日 facet 对账",
              findings=pairs,
              # A section that was skipped or blocked proves nothing about its own
              # earlier findings; the others may still be resolved.
              observed_clean=True,
              unevaluated=unevaluated_prefixes(sections),
              detail=detail,
              page_message=(
                  f"🚨 Daily facet reconcile: {len(pairs)} confirmed drift "
                  "finding(s).\n"
                  f"{detail}\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged findings
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.facet_reconcile import read_unevaluated
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          # Green with a skipped section (no Cloudflare credentials, 401/403) is not
          # proof that section's earlier findings are gone.
          outcome = resolve_page_state(
              os.environ,
              job="facet-reconcile",
              label="每日 facet 对账",
              unevaluated=read_unevaluated(os.environ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  vault-self-refresh-audit:
    # signal: vault-self-refresh-audit
    name: Vault self-refresh audit
    # Live check (#531): needs Dokploy state + SSH into the VPS to inspect vault-agent/
    # app containers, so it can't run on untrusted PR branches — scheduled + manual
    # only, same as the other live-Dokploy/SSH-state checks in this file. Reuses the
    # INFRA2_WATCHDOG_SSH_* credentials the watchdog jobs already
    # provision (no new secret) — see common/vault_self_refresh_audit.py::_ssh.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 8 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'vault-self-refresh-audit' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # #962: the page-dedup state, one issue per job (common/observability/page_dedup.py).
      issues: write
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      VPS_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
      INFRA2_WATCHDOG_SSH_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
      INFRA2_WATCHDOG_SSH_USER: ${{ secrets.INFRA2_WATCHDOG_SSH_USER }}
      INFRA2_WATCHDOG_SSH_PORT: ${{ vars.INFRA2_WATCHDOG_SSH_PORT }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      # #962: the audit's report, for the step that resolves a paged failure.
      VAULT_SELF_REFRESH_AUDIT_REPORT: ${{ github.workspace }}/vault-self-refresh-audit-report.json
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install runtime dependencies
        run: |
          sdk_requirement="$(python tools/sdk_requirement.py)"
          python -m pip install --no-deps "$sdk_requirement"
          python -m pip install -e .

      - name: Configure SSH key
        env:
          INFRA2_WATCHDOG_SSH_PRIVATE_KEY: ${{ secrets.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INFRA2_WATCHDOG_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_PRIVATE_KEY secret is required for the Vault self-refresh audit."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$INFRA2_WATCHDOG_SSH_PRIVATE_KEY" > ~/.ssh/infra2_vault_audit
          chmod 600 ~/.ssh/infra2_vault_audit
          echo "INFRA2_WATCHDOG_SSH_KEY_PATH=$HOME/.ssh/infra2_vault_audit" >> "$GITHUB_ENV"

      - name: Run Vault self-refresh audit
        run: |
          set -euo pipefail
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            echo "::error::DOKPLOY_API_KEY secret is required for the Vault self-refresh audit."
            exit 1
          fi
          if [[ -z "${VPS_HOST:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_HOST secret is required for the Vault self-refresh audit."
            exit 1
          fi
          # READ-ONLY: GETs each inventory service's Dokploy compose env and SSHes into
          # the VPS to `docker inspect`/`docker exec cat`/`docker logs` its vault-agent
          # and app containers (common/vault_self_refresh_audit.py::collect_live_
          # observations). Fails the STEP (exit 1) on ANY non-pass result, including a
          # transient SSH/Dokploy lookup hiccup, so it's visible in the run log and
          # retried on tomorrow's schedule — but only a confirmed `status="fail"`
          # result (never an "info" note, #531) pages Feishu, in the next step.
          python -m tools.vault_self_refresh_audit_check

      # #962: pages only when the set of failing checks changes; the same set on a later
      # day is a `[报告] 仍未恢复 · 第 N 天` in the reports chat (wired into this step
      # alone). A transient step failure with no confirmed `fail` result neither pages
      # nor resolves anything.
      - name: Alert on confirmed failure
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRA2_REPORTS_FEISHU_APP_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_ID }}
          INFRA2_REPORTS_FEISHU_APP_SECRET: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_SECRET }}
          INFRA2_REPORTS_FEISHU_CHAT_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.out_of_band_watchdog import deliver_out_of_band_alert
          from tools.vault_self_refresh_audit_check import (
              confirmed_finding_pairs,
              run,
              unevaluated_keys,
          )

          report = run()
          pairs = confirmed_finding_pairs(report)
          if not pairs:
              # The step failed without a confirmed fail result (e.g. a transient SSH
              # or Dokploy lookup hiccup) -- visible in the run log for a human to
              # notice, but not alert-worthy on its own (#524/#425/#475: don't page on
              # a transient blip you can't distinguish from a real failure).
              print("vault self-refresh audit step failed without a confirmed fail "
                    "result -- not paging.")
          detail = "\n".join(line for _key, line in pairs)
          outcome = dedup_page(
              os.environ,
              job="vault-self-refresh-audit",
              label="Vault self-refresh 审计",
              findings=pairs,
              # Only an all-pass run proves the earlier failures are gone, and not
              # for a check that could only say "could not compare".
              observed_clean=report["status"] == "pass",
              unevaluated=unevaluated_keys(report),
              detail=detail,
              page_message=(
                  f"🚨 Vault self-refresh audit found {len(pairs)} confirmed failing "
                  "check(s).\n"
                  f"{detail}\n"
                  "Read-only findings — investigate the named service's vault-agent/app "
                  "containers on the VPS.\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged failures
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.out_of_band_watchdog import deliver_out_of_band_alert
          from tools.vault_self_refresh_audit_check import read_unevaluated

          # A passing audit whose check could only say "could not compare" (info)
          # does not prove that check's earlier failure is gone.
          outcome = resolve_page_state(
              os.environ,
              job="vault-self-refresh-audit",
              label="Vault self-refresh 审计",
              unevaluated=read_unevaluated(os.environ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  secrets-reconcile:
    # signal: secrets-reconcile
    name: Secrets reconcile + capacity
    # Live check (secrets supply chain, PR-E): every registered service's Vault path is
    # compared with its manifest and with 1Password, and the Cloudflare quotas behind
    # the heartbeat worker are read — names and counts only, never values. The
    # comparison runs INSIDE the iac-runner (its AppRole and the 1Password service
    # account live there); this job carries the verdict, reusing the watchdog SSH key.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '27 8 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'secrets-reconcile' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # #962: the page-dedup state, one issue per job (common/observability/page_dedup.py).
      issues: write
    env:
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      VPS_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
      INFRA2_WATCHDOG_SSH_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
      INFRA2_WATCHDOG_SSH_USER: ${{ secrets.INFRA2_WATCHDOG_SSH_USER }}
      INFRA2_WATCHDOG_SSH_PORT: ${{ vars.INFRA2_WATCHDOG_SSH_PORT }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      SECRETS_RECONCILE_REPORT: ${{ github.workspace }}/secrets-reconcile-report.json
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install runtime dependencies
        run: |
          sdk_requirement="$(python tools/sdk_requirement.py)"
          python -m pip install --no-deps "$sdk_requirement"
          python -m pip install -e .
      - name: Configure SSH key
        env:
          INFRA2_WATCHDOG_SSH_PRIVATE_KEY: ${{ secrets.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INFRA2_WATCHDOG_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_PRIVATE_KEY secret is required for the secrets reconcile."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$INFRA2_WATCHDOG_SSH_PRIVATE_KEY" > ~/.ssh/infra2_secrets_reconcile
          chmod 600 ~/.ssh/infra2_secrets_reconcile
          echo "INFRA2_WATCHDOG_SSH_KEY_PATH=$HOME/.ssh/infra2_secrets_reconcile" >> "$GITHUB_ENV"
      - name: Run the secrets reconcile inside the iac-runner
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_HOST secret is required for the secrets reconcile."
            exit 1
          fi
          # Fails the STEP on any finding or transport error so it shows in the run log;
          # only a confirmed finding (never an SSH hiccup) pages Feishu in the next step.
          python -m tools.secrets_reconcile_check
      # #962: pages only when the set of page-worthy findings changes; the same set on a
      # later day is a `[报告] 仍未恢复 · 第 N 天` in the reports chat (wired into this step
      # alone). Only what the report actually observed can prove a finding gone.
      - name: Alert on confirmed findings
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRA2_REPORTS_FEISHU_APP_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_ID }}
          INFRA2_REPORTS_FEISHU_APP_SECRET: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_SECRET }}
          INFRA2_REPORTS_FEISHU_CHAT_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.out_of_band_watchdog import deliver_out_of_band_alert
          from tools.secrets_reconcile_check import (
              load_report,
              page_worthy_keys,
              page_worthy_summary,
              unevaluated_prefixes,
          )

          report = load_report(os.environ)
          summary = page_worthy_summary(report)
          if not summary:
              print("secrets reconcile step failed without a confirmed finding -- not paging.")
          outcome = dedup_page(
              os.environ,
              job="secrets-reconcile",
              label="密钥对账与容量",
              findings=page_worthy_keys(report),
              # What the report did not observe (a transport error, an unread quota,
              # a store reconciled without 1Password) proves nothing about its findings.
              observed_clean=True,
              unevaluated=unevaluated_prefixes(report),
              detail=summary,
              page_message=(
                  "🚨 Secrets reconcile found drift or a quota over budget.\n"
                  f"{summary}\n"
                  "Names only; fix the 1Password item or rerun the deploy, never type into Vault.\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged findings
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.out_of_band_watchdog import deliver_out_of_band_alert
          from tools.secrets_reconcile_check import load_report, unevaluated_prefixes

          outcome = resolve_page_state(
              os.environ,
              job="secrets-reconcile",
              label="密钥对账与容量",
              # A quota that could not be read is not a quota that is fine.
              unevaluated=unevaluated_prefixes(load_report(os.environ)),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  e2e-regressions-smoke:
    # schedule-signal-exempt: observational real-run proof of the e2e_regressions
    # smoke tier (docs/ssot/ops.e2e-regressions.md §2's declared CI trigger, which
    # no workflow actually ran until this job — 6 SSOT docs cited these test files
    # as "Proof" while nothing produced that evidence). Read-only HTTP/Playwright
    # checks against the live production estate; delivers no alerts and must
    # never gate merges. e2e_regressions/ deps are an opt-in `uv` group (#515: kept
    # out of infra-ci's default install so the fast PR unit-test job never pays for
    # deps it doesn't import) — this job is the one place that installs and runs it.
    name: e2e regressions smoke (production)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '13 5 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'e2e-regressions-smoke' || inputs.task == 'all')) }}
    # Pinned to 24.04: ubuntu-latest moved to 26.04 and the Playwright walks of truealpha failed there (truealpha#1471).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked: fail the job if uv.lock is stale or would resolve differently from
      # pyproject.toml (e.g. the e2e group's pins drifted), instead of uv silently
      # re-resolving and installing whatever it lands on -- a job named "smoke test"
      # should not also be a silent floating-dependency upgrade.
      - name: Install e2e dependency group
        run: uv sync --group e2e --locked

      - name: Install Playwright chromium
        run: uv run --group e2e --locked playwright install --with-deps chromium

      - name: Run e2e_regressions smoke suite against production
        env:
          DEPLOY_ENV: production
          INTERNAL_DOMAIN: zitian.party
        # -m smoke only: the SSOT test pyramid (ops.e2e-regressions.md §2) reserves
        # critical/full for heavier, credentialed runs (DB creds, SSO login) that
        # are a separate, later wiring step -- not silently expanded here.
        # Proof: common/tests/test_e2e_regressions_ci_wiring.py runs this step for real.
        run: |
          cd ${{ github.workspace }}
          uv run --group e2e --locked pytest e2e_regressions/tests -m smoke -v
