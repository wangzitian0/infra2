                  "actions/runs",
                  os.environ.get("GITHUB_RUN_ID"),
              ) if v
          )
          deliver_out_of_band_alert(
              os.environ,
              "🚨 VPS host-hygiene schedule could not be ensured.\n"
              "The generic host GC (docker/journald/disk prune) may not be "
              "provisioned on the VPS — host disk can fill silently. Check the "
