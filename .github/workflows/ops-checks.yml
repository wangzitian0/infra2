              findings=page_worthy_keys(report),
              # What the report did not observe (a transport error, an unread quota,
              # a store reconciled without 1Password) proves nothing about its findings.
              observed_clean=True,
              unevaluated=unevaluated_prefixes(report),
              detail=summary,
              page_message=(
                  "🚨 Secrets reconcile found drift or a quota over budget.\n"
                  f"{summary}\n"
                  "Names only; fix the 1Password item or rerun the deploy, never type into Vault.\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged findings
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.out_of_band_watchdog import deliver_out_of_band_alert
          from tools.secrets_reconcile_check import load_report, unevaluated_prefixes

          outcome = resolve_page_state(
              os.environ,
              job="secrets-reconcile",
              label="密钥对账与容量",
              # A quota that could not be read is not a quota that is fine.
              unevaluated=unevaluated_prefixes(load_report(os.environ)),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  hook-duration-report:
    # schedule-signal-exempt: report-only; opens/closes a dedup GitHub issue on read failure (#1823)
    name: Hook duration against budget
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7 6 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'hook-duration-report' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: |
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Reads the stage records (`checks[].seconds`) and warns when the p95 of a hook is
      # above 70% of its budget. It never fails on a slow hook; it fails when it cannot read.
      - name: Report hook durations
        run: python tools/hook_duration_report.py

      - name: Alert on failure
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import Finding, dedup_page, run_url_from_env

          detail = "hook duration budget report could not read stage records"
          outcome = dedup_page(
              os.environ,
              job="ops-checks.hook-duration-report",
              label="Hook 时长预算报告",
              findings=[Finding("ops-checks.hook-duration-report", detail)],
              detail=detail,
              page_message=(
                  f"🚨 {detail}.\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=lambda _env, _text: None,
              deliver_report=lambda text, _env: print(text) or True,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve alert on recovery
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state

          outcome = resolve_page_state(
              os.environ,
              job="ops-checks.hook-duration-report",
              label="Hook 时长预算报告",
              deliver_page=lambda _env, _text: None,
          )
          raise SystemExit(outcome.exit_code)
          PY

  e2e-regressions-smoke:
    # signal: e2e-regressions-smoke
    # Real-run proof of the e2e_regressions smoke tier (docs/ssot/ops.e2e-regressions.md
    # §2's declared CI trigger). Read-only HTTP/Playwright checks against the live
    # production estate; never gates merges. A red run opens one issue (key
    # prod.e2e-smoke) and a green run closes it (page_dedup). The job holds no secret:
    # the daily watchdog reports the open issue first in its card.
    # e2e_regressions/ deps are an opt-in `uv` group (#515: kept
    # out of infra-ci's default install so the fast PR unit-test job never pays for
    # deps it doesn't import) — this job is the one place that installs and runs it.
    name: e2e regressions smoke (production)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '13 5 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'e2e-regressions-smoke' || inputs.task == 'all')) }}
    # Pinned to 24.04: ubuntu-latest moved to 26.04 and the Playwright walks of truealpha failed there (truealpha#1471).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # The page-dedup state, one issue per job (common/observability/page_dedup.py).
      issues: write
    env:
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked: fail the job if uv.lock is stale or would resolve differently from
      # pyproject.toml (e.g. the e2e group's pins drifted), instead of uv silently
      # re-resolving and installing whatever it lands on -- a job named "smoke test"
      # should not also be a silent floating-dependency upgrade.
      - name: Install e2e dependency group
        run: |
          uv sync --group e2e --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore App tool caches
        uses: ./.github/actions/app-caches

      - name: Install Playwright chromium
        run: playwright install --with-deps chromium

      - name: Run e2e_regressions smoke suite against production
        env:
          DEPLOY_ENV: production
          INTERNAL_DOMAIN: zitian.party
        # -m smoke only: the SSOT test pyramid (ops.e2e-regressions.md §2) reserves
        # critical/full for heavier, credentialed runs (DB creds, SSO login) that
        # are a separate, later wiring step -- not silently expanded here.
        # Proof: common/tests/test_e2e_regressions_ci_wiring.py runs this step for real.
        run: |
          cd ${{ github.workspace }}
          python -m pytest e2e_regressions/tests -m smoke -v

      # A red smoke run opens one issue (key prod.e2e-smoke); the same red on a later
      # day is a `[报告] 仍未恢复 · 第 N 天`; a green run closes it (page_dedup).
      - name: Alert on confirmed failure
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import Finding, dedup_page, run_url_from_env

          detail = "production e2e smoke suite failed (e2e_regressions/tests -m smoke)"
          outcome = dedup_page(
              os.environ,
              job="e2e-regressions-smoke",
              label="生产 e2e 冒烟",
              findings=[Finding("prod.e2e-smoke", detail)],
              detail=detail,
              page_message=(
                  f"🚨 {detail}.\nRun: {run_url_from_env(os.environ)}"
              ),
              # No Feishu secret here: the daily watchdog reads the state issue and
              # puts it first in the report card (tools/out_of_band_watchdog.py).
              deliver_page=lambda _env, message: print(message),
              deliver_report=lambda text, _env: print(text) or True,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged failures
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state

          outcome = resolve_page_state(
              os.environ,
              job="e2e-regressions-smoke",
              label="生产 e2e 冒烟",
              deliver_page=lambda _env, message: print(message),
          )
          raise SystemExit(outcome.exit_code)
          PY
