name: Ops Checks

# Scheduled/manual operational checks:
#   - Sufficiency: every service that bakes a shared tree (common/tools/common)
#     into its image declares it, so a change actually redeploys it.
#   - Necessity:  the iac-runner is the single deploy trigger (no compose left on
#     Dokploy-native autoDeploy outside the allowlist).
#   - Out-of-band watchdog and weekly digest prove alert delivery and recall.
# Failing deploy guard / watchdog checks deliver Feishu alerts via the
# shared out-of-band channel. The watchdog job also keeps one GitHub issue per red
# check, closed by the next green scheduled run (truealpha#876 W4).

"on":
  schedule:
    - cron: "37 2 * * *"
    - cron: "47 * * * *" # hourly Dokploy preview leak detection
    - cron: "27 4 * * *" # daily re-ensure of the VPS host-hygiene Dokploy schedule
    - cron: "17 7 * * *" # daily facet reconcile: compose_id + config-hash + dns drift (#542)
    - cron: "17 8 * * *" # daily Vault self-refresh audit (#531)
    - cron: "27 8 * * *" # daily secrets reconcile + capacity (secrets supply chain, PR-E)
    - cron: "13 5 * * *" # daily e2e_regressions smoke pyramid against live production
    - cron: "7 6 * * *" # daily report-only check: a hook p95 duration above 70% of its budget (#1823)
  workflow_dispatch:
    inputs:
      task:
        description: "Ops check to run"
        required: true
        default: deploy-guard-audit
        type: choice
        options:
          - deploy-guard-audit
          - scheduled-app-audit
          - preview-leak-check
          - host-hygiene-schedule
          - facet-reconcile
          - vault-self-refresh-audit
          - secrets-reconcile
          - e2e-regressions-smoke
          - hook-duration-report
          - all
      dry_run:
        description: "Run checks without sending Feishu notifications"
        required: false
        type: boolean
        default: false

# issues: granted per job below (facet-reconcile / vault-self-refresh-audit / secrets-reconcile
# write their page-dedup state, #962), not here: each job gets only the scopes it
# uses.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'schedule' && github.event.schedule == '37 2 * * *' && 'infra2-scheduled-app-audit' || github.event_name == 'schedule' && github.event.schedule == '47 * * * *' && 'infra2-preview-leak-check' || github.event_name == 'schedule' && github.event.schedule == '27 4 * * *' && 'infra2-host-hygiene-schedule' || github.event_name == 'schedule' && github.event.schedule == '17 7 * * *' && 'infra2-facet-reconcile' || github.event_name == 'schedule' && github.event.schedule == '17 8 * * *' && 'infra2-vault-self-refresh-audit' || github.event_name == 'schedule' && github.event.schedule == '27 8 * * *' && 'infra2-secrets-reconcile' || github.event_name == 'schedule' && github.event.schedule == '13 5 * * *' && 'e2e-regressions-smoke' || github.event_name == 'schedule' && github.event.schedule == '7 6 * * *' && 'infra2-hook-duration-report' || github.event_name == 'schedule' && 'ops-checks-scheduled-fallback' || github.event_name == 'workflow_dispatch' && format('ops-checks-{0}', inputs.task) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    # signal: deploy-guard-audit
    name: Audit deploy dependency graph
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '37 2 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'deploy-guard-audit' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      # Job scope on purpose: `secrets` is not available in a step-level `if:`, so the
      # webhook-delivery step tests `env.` instead. Gating on `secrets.` made the whole
      # workflow file invalid — every job vanished and the run failed before it started
      # (main, 2026-09-10, run 34479086414).
      INFRA2_HOOKS_READ_TOKEN: ${{ secrets.INFRA2_HOOKS_READ_TOKEN }}
      # The necessity audit (dokploy.audit-autodeploy) queries the Dokploy API at
      # cloud.<INTERNAL_DOMAIN>. Without this the client falls back to cloud.localhost
      # -> Connection refused -> a nightly false-positive page (03:55 deploy-guard).
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      DEPLOY_GUARD_AUDIT_REPORT: ${{ github.workspace }}/deploy-guard-audit-report.json
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The marker-lag report reads `git tag --merged HEAD`; the default shallow
          # checkout carries no tags and would report "production IaC state is unknown"
          # every night.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Audit deploy fan-out coverage (sufficiency)
        run: python tools/deploy_guard_audit.py

      - name: Audit webhook delivery health (#682)
        # Reads the hook's own delivery list, the one record of #585's seven silent
        # weeks. Needs a token with `admin:repo_hook` READ scope — the Actions token
        # cannot carry it, so the step records `skipped` until INFRA2_HOOKS_READ_TOKEN
        # exists rather than failing daily on a permission it can never have.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.INFRA2_HOOKS_READ_TOKEN }}
        run: |
          if [[ -z "${INFRA2_HOOKS_READ_TOKEN:-}" ]]; then
            python tools/deploy_guard_audit.py --skip-check guard:webhook-delivery missing-token
          else
            python tools/deploy_guard_audit.py --record-check guard:webhook-delivery "webhook delivery health" -- python tools/webhook_delivery_audit.py --repo "$GITHUB_REPOSITORY"
          fi

      - name: Report the production marker lag (#650)
        # Delivered every run, not only on failure (#425): the line names both
        # coordinates. Non-zero only when the marker predates the release-pin deployer,
        # which is the state that breaks the next production release.
        if: ${{ !cancelled() }}
        run: python tools/deploy_guard_audit.py --record-check guard:production-marker-lag "production marker lag" -- python -m common.deploy.release_markers --repo-root .

      - name: Audit App runtime hooks manifests (#1416)
        if: ${{ !cancelled() }}
        run: python tools/deploy_guard_audit.py --record-check guard:app-hooks-manifest "App runtime hooks manifests" -- python -m tools.reconcile_iac_inputs --audit-app-hooks

      - name: Audit single deploy trigger (necessity)
        if: ${{ !cancelled() }}
        run: |
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            python tools/deploy_guard_audit.py --skip-check guard:dokploy-autodeploy missing-api-key
          else
            python tools/deploy_guard_audit.py --record-check guard:dokploy-autodeploy "Dokploy single deploy trigger" -- python -m invoke dokploy.audit-autodeploy
          fi

      - name: Upload deploy-guard audit artifacts
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-guard-audit-results
          path: deploy-guard-audit-report.json
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

      - name: Alert on confirmed failure
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRA2_REPORTS_FEISHU_APP_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_ID }}
          INFRA2_REPORTS_FEISHU_APP_SECRET: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_SECRET }}
          INFRA2_REPORTS_FEISHU_CHAT_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.deploy_guard_audit import (
              STATIC_GUARD_KEYS,
              confirmed_finding_pairs,
              observed_all_clean,
              unevaluated_prefixes,
          )
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          pairs = confirmed_finding_pairs(os.environ, keys=STATIC_GUARD_KEYS, include_hooks=False)
          if not pairs:
              print("deploy-guard audit job failed without a confirmed finding -- not paging.")
          detail = "\n".join(line for _key, line in pairs)
          outcome = dedup_page(
              os.environ,
              job="audit",
              label="部署守卫审计",
              findings=pairs,
              observed_clean=observed_all_clean(os.environ, keys=STATIC_GUARD_KEYS, include_hooks=False),
              unevaluated=unevaluated_prefixes(os.environ, keys=STATIC_GUARD_KEYS, include_hooks=False),
              detail=detail,
              page_message=(
                  f"🚨 Deploy-guard audit found {len(pairs)} failing check(s).\n"
                  f"{detail}\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged failures
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.deploy_guard_audit import STATIC_GUARD_KEYS, unevaluated_prefixes
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          outcome = resolve_page_state(
              os.environ,
              job="audit",
              label="部署守卫审计",
              unevaluated=unevaluated_prefixes(os.environ, keys=STATIC_GUARD_KEYS, include_hooks=False),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  scheduled-app-audit:
    # schedule-signal-exempt: isolates slow scheduled App runtime audits and Canary reality checks from fast static deploy guards (#1877)
    name: Run scheduled App runtime audits and Canary verification
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '37 2 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'deploy-guard-audit' || inputs.task == 'scheduled-app-audit' || inputs.task == 'all')) }}
    # Pinned to 24.04: ubuntu-latest is 26.04, where Playwright 1.57.0 has no chromium build (#1543).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      INFRA2_WATCHDOG_SSH_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
      INFRA2_WATCHDOG_SSH_USER: ${{ secrets.INFRA2_WATCHDOG_SSH_USER }}
      INFRA2_WATCHDOG_SSH_PRIVATE_KEY: ${{ secrets.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}
      INFRA2_WATCHDOG_SSH_PORT: ${{ vars.INFRA2_WATCHDOG_SSH_PORT }}
      DEPLOY_GUARD_AUDIT_REPORT: ${{ github.workspace }}/deploy-guard-audit-report.json
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore App tool caches
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        uses: ./.github/actions/app-caches

      - name: Run scheduled App runtime audits (#1493)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TA_EMAIL: ${{ secrets.TA_EMAIL }}
          TA_MEMBER_EMAIL: ${{ secrets.TA_MEMBER_EMAIL }}
          TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
          TA_MCP_TOKEN: ${{ secrets.TA_MCP_TOKEN }}
          WAIT_FOR_STAGING_READY: "1"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/deploy_guard_audit.py --record-check guard:scheduled-app-audit "scheduled App runtime audits" -- python -m tools.reconcile_iac_inputs --run-scheduled-audit --output-json scheduled-audit-result.json --artifacts-dir scheduled-audit-artifacts

      - name: Configure SSH key for Canary reality verification
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && env.INFRA2_WATCHDOG_SSH_PRIVATE_KEY != '' }}
        uses: ./.github/actions/ssh-setup
        with:
          key-name: infra2_watchdog
          private-key: ${{ env.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}

      - name: Verify Canary Todo reality (staging)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -z "${INFRA2_WATCHDOG_SSH_KEY_PATH:-}" ]]; then
            python tools/deploy_guard_audit.py --skip-check guard:canary-verify-staging missing-ssh-key
          else
            python tools/deploy_guard_audit.py --record-check guard:canary-verify-staging "Canary Todo staging reality verification" -- python -m tools.canary_verify --env staging --require-platform-deps --deep --all-slots
          fi

      - name: Upload scheduled audit artifacts
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-audit-results
          path: |
            scheduled-audit-result.json
            scheduled-audit-artifacts
            deploy-guard-audit-report.json
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

      - name: Upload scheduled audit stage record
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && env.STAGE_RECORD_POST != '' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ env.STAGE_RECORD_POST }}
          path: stage-records/${{ env.STAGE_RECORD_POST }}.json
          if-no-files-found: ignore
          overwrite: true

      - name: Alert on confirmed failure
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRA2_REPORTS_FEISHU_APP_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_ID }}
          INFRA2_REPORTS_FEISHU_APP_SECRET: ${{ secrets.INFRA2_REPORTS_FEISHU_APP_SECRET }}
          INFRA2_REPORTS_FEISHU_CHAT_ID: ${{ secrets.INFRA2_REPORTS_FEISHU_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.deploy_guard_audit import (
              RUNTIME_GUARD_KEYS,
              confirmed_finding_pairs,
              observed_all_clean,
              unevaluated_prefixes,
          )
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          pairs = confirmed_finding_pairs(os.environ, keys=RUNTIME_GUARD_KEYS, include_hooks=True)
          if not pairs:
              print("scheduled app audit job failed without a confirmed finding -- not paging.")
          detail = "\n".join(line for _key, line in pairs)
          outcome = dedup_page(
              os.environ,
              job="scheduled-app-audit",
              label="应用运行态与 Canary 定时审计",
              findings=pairs,
              observed_clean=observed_all_clean(os.environ, keys=RUNTIME_GUARD_KEYS, include_hooks=True),
              unevaluated=unevaluated_prefixes(os.environ, keys=RUNTIME_GUARD_KEYS, include_hooks=True),
              detail=detail,
              page_message=(
                  f"🚨 Scheduled App runtime audit found {len(pairs)} failing check(s).\n"
                  f"{detail}\n"
                  f"Run: {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the paged failures
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.deploy_guard_audit import RUNTIME_GUARD_KEYS, unevaluated_prefixes
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          outcome = resolve_page_state(
              os.environ,
              job="scheduled-app-audit",
              label="应用运行态与 Canary 定时审计",
              unevaluated=unevaluated_prefixes(os.environ, keys=RUNTIME_GUARD_KEYS, include_hooks=True),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

  watchdog:
    # Moved to .github/workflows/watchdog.yml; zero-secret stub removed once main contract drops entry.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  digest:
    # Moved to .github/workflows/watchdog.yml; zero-secret stub removed once main contract drops entry.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  preview-leak-check:
    # signal: preview-leak-check
    name: Detect leaked Dokploy previews
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '47 * * * *') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'preview-leak-check' || inputs.task == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # the page-dedup state, one issue per job (common/observability/page_dedup.py)
      issues: write
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      # github.token reads the (public) app repo's open PRs; a dedicated PAT can
      # override it. Absent/blocked => only bare-slug leaks are flagged (fail-safe).
      PREVIEW_LEAK_GH_TOKEN: ${{ secrets.PREVIEW_LEAK_GH_TOKEN || github.token }}
      INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE: ${{ secrets.INFRA2_OUT_OF_BAND_ALERT_DELIVERY_MODE }}
      INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_WEBHOOK_URL }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_APP_SECRET }}
      INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_CHAT_ID }}
      INFRA2_OUT_OF_BAND_FEISHU_API_BASE: ${{ secrets.INFRA2_OUT_OF_BAND_FEISHU_API_BASE }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install runtime dependencies
        run: |
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Detect leaked previews
        run: |
          set -euo pipefail
          if [[ -z "${DOKPLOY_API_KEY:-}" ]]; then
            echo "::error::DOKPLOY_API_KEY secret is required for the preview leak check."
            exit 1
          fi
          # Detect only — NEVER deletes from CI. A leak exits non-zero so the
          # alert step below fires; remediation is a manual SOP step
          # (`python -m tools.preview_leak_check --remediate`), see
          # docs/ssot/ops.pipeline.md#preview.
          python -m tools.preview_leak_check

      - name: Alert on leaked previews
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import dedup_page, run_url_from_env
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          outcome = dedup_page(
              os.environ,
              job="preview-leak-check",
              label="Dokploy 预览泄漏",
              findings=[("preview-leak-check", "a preview stack outlived its lifecycle")],
              detail="a preview stack outlived its lifecycle",
              page_message=(
                  "🚨 Dokploy preview LEAK detected.\n"
                  "A preview stack outlived its lifecycle (a 1:1 teardown was skipped "
                  "or failed). This is an exception, not routine — root-cause the "
                  "teardown, then remediate per the SOP "
                  "(docs/ssot/ops.pipeline.md#preview): "
                  "`python -m tools.preview_leak_check --remediate`.\n"
                  f"Run (see leak list): {run_url_from_env(os.environ)}"
              ),
              deliver_page=deliver_out_of_band_alert,
          )
          raise SystemExit(outcome.exit_code)
          PY

      - name: Resolve the leaked-preview alert
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from common.observability.page_dedup import resolve_page_state
          from tools.out_of_band_watchdog import deliver_out_of_band_alert

          outcome = resolve_page_state(
              os.environ,
              job="preview-leak-check",
              label="Dokploy 预览泄漏",
