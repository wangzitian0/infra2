name: Deploy (deploy_v2)

# The infra2-owned deploy entrypoint for the finance_report and truealpha apps (Infra-009,
# finance_report#883: "infra2 owns every deploy"). Wraps `python -m tools.deploy_v2` —
# the unified (service, type, version_ref, iac_ref) front door — for staging and
# preview deploys (direct prod dispatch is retired; prod promotions use
# reconcile-iac-inputs.yml promote_prod=true).
#
# This replaces the per-env App-repo bash (tools/dokploy_deploy.sh).
#
# No pre-deploy App canary (#1477): the Canary Todo (platform/30.todo) is the one Canary.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service key. Use bootstrap/iac-runner to run the IaC Runner bootstrap update."
        required: false
        default: finance_report/app
      type:
        description: "Deploy type (staging | preview)"
        required: false
        default: staging
        type: choice
        options: [staging, preview]
      version_ref:
        description: "Version surface: pr-<N> or PR# (preview) | main (preview) | tag vX.Y.Z (staging; defaults to harness/repos.yaml for apps or latest infra2 tag for platform)"
        required: false
        default: ""
      iac_ref:
        description: "Optional infra2 ref override (defaults to latest release tag on staging, main on preview)"
        required: false
        default: ""
      domain:
        description: "Optional base domain override (defaults to service domain or INTERNAL_DOMAIN)"
        required: false
        default: ""
      bootstrap:
        description: "staging app only — allow version_ref not matching harness/repos.yaml"
        required: false
        type: boolean
        default: false
      timeout:
        description: "health-check seconds"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  # One in-flight deploy per type; never let two deploys race the same compose/slot.
  group: ${{ inputs.service == 'bootstrap/iac-runner' && 'iac-runner-bootstrap' || format('deploy-v2-{0}', github.event.inputs.type) }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy_v2 ${{ github.event.inputs.type }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && inputs.service != 'bootstrap/iac-runner' }}
    # A prod deploy waits here for the owner (#1125).
    environment: ${{ inputs.type == 'prod' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # deploy_v2's on-main guard asks GitHub's compare API; without a token the call is
      # anonymous and shares a 60/hour budget per runner IP (#635: `403 rate limit exceeded`).
      GITHUB_TOKEN: ${{ github.token }}
      # The ONE shared control-plane domain (common.deploy.env_config.infra_domain, #561).
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
      # Every service routes through iac_runner SyncPipeline v2.
      IAC_WEBHOOK_SECRET: ${{ secrets.IAC_WEBHOOK_SECRET }}
      IAC_RUNNER_STAGING_URL: ${{ vars.IAC_RUNNER_STAGING_URL || 'https://iac-staging.zitian.party' }}
      IAC_RUNNER_URL: ${{ vars.IAC_RUNNER_URL || 'https://iac.zitian.party' }}
    steps:
      - name: Reject retired prod dispatch
        if: ${{ inputs.type == 'prod' }}
        run: |
          echo "::error::Direct prod deploy via deploy.yml is retired; use reconcile-iac-inputs.yml promote_prod=true"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install runtime dependencies
        # common/security/store.py reads secret stores through infra2-sdk; install the wheel uv.lock
        # pins, hash-verified (#649, #1115). The IaC runner image can hold an older SDK
        # until a production rebuild; test_runner_sdk_compat.py guards that gap.
        run: |
          sdk="$(python tools/sdk_requirement.py)"
          python -m pip install invoke httpx python-dotenv rich "$sdk"

      - name: Run deploy_v2
        env:
          SERVICE_INPUT: ${{ github.event.inputs.service || 'finance_report/app' }}
          TYPE_INPUT: ${{ github.event.inputs.type }}
          VERSION_REF_INPUT: ${{ github.event.inputs.version_ref || '' }}
          IAC_REF_INPUT: ${{ github.event.inputs.iac_ref || '' }}
          DOMAIN_INPUT: ${{ github.event.inputs.domain || '' }}
          BOOTSTRAP_INPUT: ${{ github.event.inputs.bootstrap }}
          TIMEOUT_INPUT: ${{ github.event.inputs.timeout || '600' }}
        run: |
          set -euo pipefail

          # All services dispatch through iac-runner SyncPipeline v2.
          if [[ -z "${IAC_WEBHOOK_SECRET:-}" || -z "${IAC_RUNNER_URL:-}" ]]; then
            echo "::error::IAC_WEBHOOK_SECRET and IAC_RUNNER_URL are required for deploy_v2."
            exit 1
          fi

          args=(--service "$SERVICE_INPUT"
                --type "$TYPE_INPUT"
                --version-ref "$VERSION_REF_INPUT"
                --timeout "$TIMEOUT_INPUT")
          [[ -n "$IAC_REF_INPUT" ]] && args+=(--iac-ref "$IAC_REF_INPUT")
          [[ -n "$DOMAIN_INPUT" ]] && args+=(--domain "$DOMAIN_INPUT")
          [[ "$BOOTSTRAP_INPUT" == "true" ]] && args+=(--bootstrap)
          echo "deploy_v2 ${args[*]}"
          set +e
          out="$(python -m tools.deploy_v2 "${args[@]}")"
          rc=$?
          set -e

          echo "deploy_v2 output: $out"
          {
            echo "## Deploy (deploy_v2) — $TYPE_INPUT"
            echo ""
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $rc -ne 0 ]]; then
            echo "::error::deploy_v2 $TYPE_INPUT failed (exit $rc)."
            exit $rc
          fi
          echo "deploy_v2 $TYPE_INPUT succeeded."

  # IaC runner bootstrap jobs
  bootstrap:
    name: update iac_runner bootstrap
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.service == 'bootstrap/iac-runner' }}
    # L1 bootstrap self-update and runner rebuild are production changes (#1125).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify commit is on origin/main
        run: |
          set -euo pipefail
          git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Configure SSH key for IaC Runner bootstrap update
        uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.INFRA2_WATCHDOG_SSH_PRIVATE_KEY }}
          key-name: infra2_bootstrap
          required: "true"
          purpose: "IaC Runner bootstrap update"

      - name: Deploy IaC Runner bootstrap changes
        env:
          INFRA2_WATCHDOG_SSH_HOST: ${{ secrets.INFRA2_WATCHDOG_SSH_HOST }}
          INFRA2_WATCHDOG_SSH_USER: ${{ secrets.INFRA2_WATCHDOG_SSH_USER }}
          INFRA2_WATCHDOG_SSH_PORT: ${{ vars.INFRA2_WATCHDOG_SSH_PORT }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA2_WATCHDOG_SSH_HOST:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_HOST is required."
            exit 1
          fi
          if [[ -z "${INFRA2_WATCHDOG_SSH_USER:-}" ]]; then
            echo "::error::INFRA2_WATCHDOG_SSH_USER is required."
            exit 1
          fi

          ssh_port="${INFRA2_WATCHDOG_SSH_PORT:-22}"
          ssh \
            -i "${INFRA2_WATCHDOG_SSH_KEY_PATH}" \
            -p "$ssh_port" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${INFRA2_WATCHDOG_SSH_USER}@${INFRA2_WATCHDOG_SSH_HOST}" \
            "INFRA2_DEPLOY_SHA='${GITHUB_SHA}' bash -s" \
            < scripts/deploy_iac_runner_bootstrap.sh

      - name: Check IaC Runner health
        env:
          IAC_RUNNER_URL: ${{ vars.IAC_RUNNER_URL || 'https://iac.zitian.party' }}
        run: |
          set -euo pipefail

          health_url="${IAC_RUNNER_URL%/}/health"
          body="$(mktemp)"
          last_status=""

          for attempt in $(seq 1 12); do
            : > "$body"
            status="$(curl -sS -o "$body" -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              "$health_url" || true)"
            last_status="$status"

            echo "IaC Runner public health attempt ${attempt}/12: url=$health_url status=$status"
            if [[ -s "$body" ]]; then
              sed 's/^/  /' "$body" || true
            else
              echo "  <empty body>"
            fi

            if [[ "$status" == "200" ]]; then
              rm -f "$body"
              exit 0
            fi

            sleep 10
          done

          rm -f "$body"
          echo "::error::IaC Runner public health stayed unhealthy after 12 attempts. Last HTTP status: $last_status. Check Traefik/Dokploy routing, Cloudflare propagation, Vault AppRole (VAULT_ROLE_ID/VAULT_SECRET_ID), and iac-runner container health."
          exit 1
