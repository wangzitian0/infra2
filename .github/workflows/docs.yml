name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      # Runs before the site build so a dead cross-reference fails on its own
      # terms rather than as an mkdocs error, and so it still runs if the
      # site build is ever changed or removed. AGENTS.md builds the whole
      # wiki on cross-references; until this existed, nothing checked them.
      - name: Check relative documentation links
        run: python3 tools/doc_link_check.py

      # Both indexes are projections of documentation, and infra-ci's copies of
      # these two gates sit in a job that only runs when a pull request changes
      # a non-Markdown file. So the change that makes an index stale -- adding,
      # renaming or re-statusing a project doc, hand-editing a generated block
      # -- is exactly the change that skipped the gate. This workflow runs on
      # `**/*.md`, so between the two nothing is left uncovered; proof in
      # libs/tests/test_docs_only_prs_run_their_own_gates.py.
      # (PyYAML for gen_ssot_index arrives with mkdocs, verified 6.0.3.)
      - name: Gate generated doc indexes are in sync
        run: |
          python3 tools/gen_project_index.py
          python3 tools/gen_ssot_index.py

      - name: Build site
        run: mkdocs build --config-file docs/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
