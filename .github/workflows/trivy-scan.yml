name: Trivy Security Scan

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/compose*.yaml"
      - "**/requirements*.txt"
      - "uv.lock"
      - ".github/workflows/trivy-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy filesystem and config vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem and config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
