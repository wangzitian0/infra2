name: Infrastructure CI

on:
  # No `paths:` filter, deliberately. GitHub's branch protection waits for the
  # seven required contexts below on *every* pull request; a `paths:` filter
  # does not say "this check does not apply here", it says "this workflow does
  # not start" -- and a workflow that never starts never reports, so the PR sits
  # at BLOCKED waiting on a status that will never arrive. The only way out is a
  # manual merge that bypasses the gate, and a guard that gets bypassed stops
  # being a guard.
  #
  # The list used to be maintained by hand, which failed twice, both times when a
  # new top-level directory appeared and nobody thought to add it: #817 (a PR
  # touching only harness/workspace/*.md, "fixed" by hand-adding harness/**) and
  # #850 (a PR touching only skills/**, which did not exist when the list was
  # last edited, so the earlier hand-fix did not help). Adding one more glob
  # fixes the instance and guarantees the recurrence.
  #
  # Cost control did not go away, it moved one level in: `detect-changes` below
  # runs unconditionally and every gated job is skipped via `if:`. A skipped job
  # still reports a conclusion branch protection accepts, so a prose-only PR
  # still reaches a passing required-check state within seconds -- the same
  # saving the path list was there for, without the deadlock. What it costs is
  # one ~20s detect-changes run on pull requests that previously started nothing.
  #
  # common/tests/test_required_checks_can_report.py locks this, computing its scope
  # from ci-gate-inventory.yaml's blocks_merge gates rather than naming this file,
  # so promoting any future check to blocks_merge: true extends the guard with it.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # detect-changes runs unconditionally (no path filter of its own) and
  # every other job below is gated on its has_non_doc output, not on
  # whether the *workflow* triggered at all. That distinction is the whole
  # point: a required check whose *job* is skipped via `if:` still reports
  # a conclusion GitHub's branch protection accepts as satisfying the
  # requirement, but a required check whose *workflow* never triggers in
  # the first place never reports anything, and blocks merge forever
  # waiting on a status that will never arrive -- exactly what happened to
  # submodule-pointer-only PRs before the path list above included the
  # bare gitlink paths (repos/finance_report, repos/truealpha, etc.),
  # which never match a `dir/**` glob since a gitlink bump changes that
  # exact path, never a file beneath it.
  #
  # A PR whose entire diff is Markdown doesn't need any of these
  # infra/deploy/vault gates to run at all -- has_non_doc lets those PRs
  # skip straight to a passing required-check state instead of waiting on
  # (or paying for) real compose/vault/deployer validation that a prose-only
  # change can't affect.
  detect-changes:
    name: Detect Non-Doc Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the artifact list and the merged pull request for the tree reuse lookup
      # below (#1602). Public reads work without them; a private repository needs both.
      actions: read
      pull-requests: read
    outputs:
      has_non_doc: ${{ steps.check.outputs.has_non_doc }}
      gate_changed: ${{ steps.gate.outputs.gate_changed }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install the SDK that uv.lock pins
        run: |
          pip install "pydantic>=2.7,<3" pyyaml
          pip install --no-deps "$(python tools/sdk_requirement.py)"

      - name: Check whether every changed file is Markdown
        id: check
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A force-push or a branch's first push reports an all-zero
          # `before` SHA -- there is no real diff to compare, so treat it
          # as "not doc-only" (run everything) rather than fail the check.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "has_non_doc=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qvE '\.md$' \
            || echo "$changed" | grep -qE '^(AGENTS|CLAUDE)\.md$' \
            || echo "$changed" | grep -qE '^\.agents/skills/.*\.md$' \
            || echo "$changed" | grep -qE '^docs/project/.*\.md$' \
            || echo "$changed" | grep -qE '^docs/ssot/README\.md$'; then
            echo "has_non_doc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_non_doc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether any changed file is self-governing
        id: gate
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          git rev-parse --verify origin/main >/dev/null 2>&1 || git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          gate_changed="$(printf '%s\n' "$changed" | python -c '
          import json, sys
          from pathlib import Path
          from common.core.ref_worktree import run_at_ref
          files = [line.strip() for line in sys.stdin if line.strip()]
          if not files:
              print("false")
              raise SystemExit(0)
          script = (
              "import json, sys\n"
              "from common.gate.self_governance import is_self_governing\n"
              "files = json.load(sys.stdin)\n"
              "print(\"true\" if any(is_self_governing(path) for path in files) else \"false\")\n"
          )
          proc = run_at_ref("origin/main", [sys.executable, "-c", script], root=Path("."), timeout=60, stdin=json.dumps(files))
          if proc.returncode != 0:
              raise SystemExit(proc.stderr or proc.returncode)
          print(proc.stdout.strip().splitlines()[-1])
          ')"
          echo "gate_changed=${gate_changed}" >> "$GITHUB_OUTPUT"

      # A squash merge onto an unchanged base gives main the tree that the pull
      # request's merge ref already passed (14 of 20 merges, #1602). For such a push
      # the shards would run the same tests on the same bytes again. The lookup prints
      # the id of that green pull-request run, or nothing; any error prints nothing,
      # so the shards run. test-deployer-logic then reads that run's coverage data.
      - name: Find a green pull-request run of the same tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          commit="$(git rev-parse HEAD)"
          run_id="$(python3 tools/ci_tree_reuse.py --repo "${{ github.repository }}" --tree "$tree" --commit "$commit" || true)"
          # Only a run id may become the output: anything else runs the shards.
          [[ "$run_id" =~ ^[0-9]+$ ]] || run_id=""
          echo "tree=${tree} reuse_run_id=${run_id:-none}"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

  validate-compose:
    name: Validate Compose Files
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint dependencies
        # PyYAML and infra2-sdk: the compose compiler, the compose validation and the lint below.
        run: python3 -m pip install --quiet pyyaml "$(python3 tools/sdk_requirement.py)"

      - name: Validate all compose.yaml files
        # infra2#1884: a plain file runs `docker compose config` on its source. An x-infra2
        # file runs it on its compiled text. common/deploy/compose_validate.py holds the
        # command and the dummy environment (CI_COMPOSE_ENV).
        run: |
          set -e
          echo "🔍 Validating compose files..."
          find . \( -name "compose.yaml" -o -name "*.compose.yaml" \) -type f -print0 | sort -z | xargs -0 python3 -m tools.compose_compile validate
          echo "✅ All compose files are valid"

      - name: Trivy vulnerability and config scan
        # #1637: a fixable CRITICAL or HIGH finding blocks the PR. DS-0002 sits in .trivyignore.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Lint compose resource limits and image pins
        # ops.standards.md §5 and §6: memory ceilings and no bare :latest tags across all compose files.
        run: python3 tools/lint_compose_resource_limits.py

      - name: Check x-infra2 compose equivalence against the PR base
        # infra2#1822: each plain compose file must compile to its own bytes. A file that
        # changes from plain to x-infra2 must equal its hand-written file at the PR base
        # after the normalizations in common/deploy/compose_equivalence.py.
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "::error::pull_request base SHA is missing"
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"
          python3 -m tools.compose_compile check --base "$base"

  harness-check:
    name: Validate Workspace Harness
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install pyyaml
        run: pip install pyyaml

      # Read-only: validates harness/repos.yaml against the actual checked-out
      # repositories (roles, governance, authority files). --no-submodules-expected
      # because this workflow never runs `submodules: true` (deliberately, to keep
      # the big app submodules out of infra CI's fetch) — every submodule checkout
      # is expected-absent here, not a real gap (#506).
      - name: Run harness check
        run: python3 -m tools.harness check --no-submodules-expected

  # Parallel shards (the matrix below is the only place that states the count) run the traced unit tests (#1499).
  # Each test file belongs to one shard. common/ci_plugins/pytest_shard.py assigns the files by their
  # measured seconds (shard_weights.json) before collection, so a worker imports only its own files (#1602).
  # The final job `test-deployer-logic` combines the coverage data and keeps the required check name.
  test-unit-shard:
    name: Unit tests shard ${{ matrix.shard }}/${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true' && needs.detect-changes.outputs.reuse_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}
          uv sync --locked

      # Fail fast left to right: run sub-second static, SSOT and drift gates first
      # so documentation/contract drift fails in <5 seconds rather than waiting for
      # the 2-minute unit test suite. The preflight reads only the tree, so one shard
      # runs it; the other shards do not repeat the same 7 s (#1602).
      - name: Gate preflight static, SSOT, and drift checks
        if: matrix.shard == 1
        run: |
          cd ${{ github.workspace }}
          # tools.ci_gate_audit --enforce
          uv run --locked --no-sync python -m tools.ci_runner preflight

      # The finance_report alert contract tests read the files that PINNED_FILES of
      # common/tests/finance_report_sources.py names, at the repos/finance_report gitlink
      # commit. Check out only those files (a blob-less depth-1 fetch of one commit, about
      # 5 s) outside the infra2 tree: repos/finance_report stays empty, so the harness still
      # sees no app checkout (#506). The step exports the path as
      # FINANCE_REPORT_PINNED_CHECKOUT; with CI set, the tests read only that path and never
      # fetch (#1816).
      - name: Check out the pinned finance_report contract files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cd ${{ github.workspace }}
          sha=$(git ls-files --stage -- repos/finance_report | awk '$1 == "160000" {print $2}')
          test -n "$sha"
          url=$(uv run --locked --no-sync python -c "from common.tests.finance_report_sources import APP_SOURCES, SERVICE_ID; print('https://github.com/' + APP_SOURCES[SERVICE_ID] + '.git')")
          files="$RUNNER_TEMP/finance_report_files"
          uv run --locked --no-sync python -c "from common.tests.finance_report_sources import PINNED_FILES; print(chr(10).join(PINNED_FILES))" > "$files"
          pin="$RUNNER_TEMP/finance_report_pin"
          git init -q "$pin"
          git -C "$pin" remote add origin "$url"
          git -C "$pin" sparse-checkout set --no-cone --stdin < "$files"
          git -C "$pin" fetch -q --depth=1 --filter=blob:none origin "$sha"
          git -C "$pin" checkout -q --detach FETCH_HEAD
          test "$(git -C "$pin" rev-parse HEAD)" = "$sha"
          while read -r file; do test -f "$pin/$file"; echo "pinned: $file"; done < "$files"
          echo "FINANCE_REPORT_PINNED_CHECKOUT=$pin" >> "$GITHUB_ENV"

      # app_manifest_verify reads harness/repos.yaml at the newest production marker. A
      # depth-1 fetch of the marker tags brings only the tagged commits.
      - name: Fetch the production markers
        if: matrix.shard == 1
        timeout-minutes: 2
        run: git fetch --quiet --depth=1 origin '+refs/tags/production/*:refs/tags/production/*'

      - name: Run infra unit tests
        # PYTHONSAFEPATH (not -P) so pytest-xdist's execnet worker subprocesses also
        # get path isolation — a CLI flag on the parent invocation doesn't propagate to
        # them, and without it they resolve `import platform` to this repo's own
        # platform/ package (it has an __init__.py) instead of the stdlib module and
        # crash on startup.
        env:
          PYTHONSAFEPATH: "1"
          # PYTHONSAFEPATH drops the working directory from sys.path, so name the plugin
          # directory (it holds only pytest_shard.py and its weights). xdist workers inherit it.
          PYTHONPATH: ${{ github.workspace }}/common/ci_plugins
          COVERAGE_FILE: ${{ github.workspace }}/coverage/.coverage.shard${{ matrix.shard }}
          # Python 3.12+ sys.monitoring tracer: line coverage at about the cost of no
          # coverage (shard 1 locally: 98 s CPU with the C tracer, 60 s with sysmon) (#1506).
          COVERAGE_CORE: sysmon
        run: |
          cd ${{ github.workspace }}
          mkdir -p coverage
          # Guard: fail when a vendored app manifest returns under contracts/. Since #1320 this
          # script fetches nothing; deploys read app manifests at the release commit.
          # (script path, not -m: the job runs with PYTHONSAFEPATH=1, so `tools` is not a package on sys.path)
          uv run --locked --no-sync python tools/fetch_app_manifests.py
          # Guard: each App stack manifest copy equals its projection at the pinned release
          # tag (#1822). It reads the App manifests from GitHub, so only shard 1 runs it.
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            uv run --locked --no-sync python tools/app_manifest_sync.py --check
            # The real verify_app_manifests (a unit test stubs it): each App stack, staging
            # and prod, at the pinned and the production release tags (#1822, v3.1.148).
            uv run --locked --no-sync python tools/app_manifest_verify.py
          fi
          # Print the runner facts that explain a slow run (#1494). The worker count comes
          # from pytest-xdist's own hook, so it equals what `-n auto` uses. Never fail the step.
          uv run --locked --no-sync python -c "import os, types, xdist.plugin as p; cpu = next((l.split(':', 1)[1].strip() for l in open('/proc/cpuinfo') if l.startswith('model name')), 'unknown') if os.path.exists('/proc/cpuinfo') else 'unknown'; print('runner: nproc=%s cpu_model=%s xdist_workers=%s' % (os.cpu_count(), cpu, p.pytest_xdist_auto_num_workers(types.SimpleNamespace(option=types.SimpleNamespace(numprocesses='auto')))))" || echo "runner: facts unavailable"
          uv run --locked --no-sync python -m pytest common/tests -q -n auto \
            -p pytest_shard --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --cov=common \
            --cov=tools \
            --cov-report= \
            --cov-fail-under=0 \
            --shard-durations-out=coverage/durations.shard${{ matrix.shard }}.json

      - name: Upload coverage data of this shard
        uses: actions/upload-artifact@v7
        with:
          name: infra2-coverage-data-shard${{ matrix.shard }}
          path: |
            coverage/.coverage.shard${{ matrix.shard }}
            coverage/durations.shard${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error


  test-deployer-logic:
    name: Test Deployer Hash Logic
    needs: [detect-changes, test-unit-shard]
    # always(): a required check that is skipped counts as passed, so this job must run
    # after a failed or cancelled shard and fail itself (#1499).
    if: always() && needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Download the shard coverage of a reused pull-request run (#1602).
      actions: read
    steps:
      # With a reused run the shards are skipped on purpose; anything else must be success.
      - name: Require every unit-test shard to succeed, or a reused green run
        env:
          SHARD_RESULT: ${{ needs.test-unit-shard.result }}
          REUSE_RUN_ID: ${{ needs.detect-changes.outputs.reuse_run_id }}
        run: |
          echo "test-unit-shard result: ${SHARD_RESULT} reuse_run_id: ${REUSE_RUN_ID:-none}"
          if [ -n "${REUSE_RUN_ID}" ]; then
            [ "${SHARD_RESULT}" = "skipped" ]
          else
            [ "${SHARD_RESULT}" = "success" ]
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}
          uv sync --locked --no-dev

      - name: Download coverage data of the shards
        if: needs.detect-changes.outputs.reuse_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: infra2-coverage-data-shard*
          path: coverage
          merge-multiple: true

      - name: Download coverage data of the reused pull-request run
        if: needs.detect-changes.outputs.reuse_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: infra2-coverage-data-shard*
          path: coverage
          merge-multiple: true
          run-id: ${{ needs.detect-changes.outputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Combine shard coverage into one report
        run: |
          cd ${{ github.workspace }}
          # --keep: leave the shard files in place for a rerun of this step.
          uv run --locked --no-sync coverage combine --keep coverage/.coverage.shard*
          uv run --locked --no-sync coverage report --show-missing
          uv run --locked --no-sync coverage xml -o coverage/infra2-coverage.xml

      - name: Upload infra coverage context
        uses: actions/upload-artifact@v7
        with:
          name: infra2-coverage-context
          path: coverage/infra2-coverage.xml
          if-no-files-found: error

      - name: Upload infra coverage to Coveralls
        # gate-exempt: reporting a number to a third party, not checking one —
        # Coveralls being down must not fail the job that proves the deployer.
        # The gate this job carries is `Run infra unit tests`, above.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: cobertura
          file: coverage/infra2-coverage.xml

      - name: Gate coverage regression
        run: |
          cd ${{ github.workspace }}
          uv run --locked --no-sync python tools/coverage_regression_audit.py

      # Shift-left: surface what this PR would re-deploy once released, and prove the
      # reconcile plan BUILDS on these changes (deploy-dependencies fan-out + service
      # contracts resolve) — so 'release-time only' failures fail here, in the PR, instead.
      # --dry-run never deploys and is exempt from the origin/main provenance guard.
      - name: Gate reconcile plan builds for changed files
        if: github.event_name == 'pull_request'
        run: |
          set -e
          cd ${{ github.workspace }}
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "::error::pull_request base SHA is missing"
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"
          if ! diff_out="$(git diff --name-only "${base}..HEAD")"; then
            echo "::error::git diff against PR base ${base} failed"
            exit 1
          fi
          if [ -z "$diff_out" ] && [ "${{ needs.detect-changes.outputs.has_non_doc }}" = "true" ]; then
            echo "::error::non-doc PR yielded zero changed files against ${base}"
            exit 1
          fi
          args=(--after HEAD --dry-run)
          while IFS= read -r changed_file; do
            [[ -n "$changed_file" ]] && args+=(--changed-file "$changed_file")
          done <<< "$diff_out"
          uv run --locked --no-sync python -m tools.reconcile_iac_inputs "${args[@]}"

      # #504/#541: the inventory's `blocks_merge: true` gates vs the LIVE GitHub branch
      # ruleset for main (the repo is public, so the default token can read the rules
      # API). Enforced in CI (#1877) so missing or stale ruleset contexts fail closed.
      - name: Audit CI-gate inventory vs live ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd ${{ github.workspace }}
          uv run --locked --no-sync python -m tools.ci_gate_ruleset_audit --enforce

      # Print the measured load of each shard and merge the file seconds (#1602).
      # When the loads drift apart, copy the artifact to common/ci_plugins/shard_weights.json.
      - name: Report shard loads and merge the measured weights
        # gate-exempt: reporting shard balance for a later commit, not checking code.
        # It runs after every gate of this job, so a failure here hides no gate.
        continue-on-error: true
        run: |
          cd ${{ github.workspace }}
          uv run --locked --no-sync python common/ci_plugins/pytest_shard.py merge \
            coverage/shard_weights.json coverage/durations.shard*.json

      - name: Upload measured shard weights
        # gate-exempt: an artifact for a later commit; the artifact service being down
        # must not fail the required check.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: infra2-shard-weights
          path: coverage/shard_weights.json
          if-no-files-found: warn
          overwrite: true

      # The marker says: every gate above passed on this tree, with the shards of this
      # run. A later push to main with the same tree reuses this run (#1602).
      - name: Record the tested tree
        id: tree
        if: github.event_name == 'pull_request' && needs.test-unit-shard.result == 'success'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "${tree} ${{ github.run_id }}" > coverage/unit-green.txt
          echo "sha=${tree}" >> "$GITHUB_OUTPUT"

      - name: Upload the tested-tree marker
        # gate-exempt: a marker for a later push; without it main runs the shards again.
        # The artifact service being down must not fail the required check.
        if: steps.tree.outputs.sha != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-green-${{ steps.tree.outputs.sha }}
          path: coverage/unit-green.txt
          if-no-files-found: warn
          overwrite: true

  test-1password-healthcheck:
    name: Test 1Password Healthcheck
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          # Restore the Go build cache: a cold build compiles net/http and takes 17-21 s
          # on every PR (#1602). The package has no go.sum (GOPATH mode), so key the
          # cache on its source file.
          cache: true
          cache-dependency-path: bootstrap/04.1password/healthcheck.go

      - name: Build healthcheck binary
        run: |
          cd ${{ github.workspace }}
          GO111MODULE=off go test ./bootstrap/04.1password
          GO111MODULE=off go build -o /tmp/op-connect-healthcheck ./bootstrap/04.1password

  validate-vault-agent:
    name: Validate Vault Agent Config
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install Vault gate dependencies
        run: |
          cd ${{ github.workspace }}
          python3 -m pip install --quiet pyyaml python-hcl2 "$(python3 tools/sdk_requirement.py)"

      - name: Run Vault agent, compose healthcheck, and policy checks
        run: |
          cd ${{ github.workspace }}
          python3 -m tools.ci_runner vault --require-hcl2

  validate-deployers:
    name: Validate Deployer Classes
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}
          uv sync --locked --no-dev

      - name: Validate Deployer classes and service facet matrix
        run: |
          cd ${{ github.workspace }}
          uv run --locked --no-sync python -m tools.ci_runner deployers

  lint-python:
    name: Lint Python Code
    needs: detect-changes
    if: needs.detect-changes.outputs.has_non_doc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: pip install "ruff==0.15.22"  # pinned: 0.16 added rules that fail the estate repo-wide (2026-07-27); bump deliberately with the fixes

      - name: Run ruff check
        run: ruff check common/ bootstrap/ platform/ finance_report/ truealpha/ tools/

      - name: Run ruff format check
        run: ruff format --check common/ bootstrap/ platform/ finance_report/ truealpha/ tools/

      - name: Run anti-tautology test linter
        run: |
          targets=("common/tests")
          if [ -d repos/infra2-sdk/tests ]; then
            targets+=("repos/infra2-sdk/tests")
          fi
          python tools/lint_anti_tautology.py "${targets[@]}"

  # The CI post record of a commit on main (#1645). The production pre record of a release
  # reads it, so it names every job of the merge authority (`blocks_merge: true` in
  # docs/ssot/ci-gate-inventory.yaml). always(): a failed job is a red check, not a missing one.
  # Read-only: would a production promotion pass require_upstream_post now? It runs the guard
  # on the real stage records of the next candidate tag. A pull request that does not change
  # the guard skips in one second (#1830). The schedule runs it in ops-checks.yml, report-only.
  promotion-probe:
    name: Probe the production promotion guard
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_non_doc == 'true'
    permissions:
      contents: read
      # read the stage record artifacts
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install the SDK that uv.lock pins
        run: |
          pip install "pydantic>=2.7,<3" pyyaml httpx
          pip install --no-deps "$(python tools/sdk_requirement.py)"

      # --report-only: the inventory gives this job blocks_merge: false; a refusal of the
      # current candidate is an open production decision, not a defect of the pull request.
      - name: Probe the guard when the pull request changes it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/promotion_probe.py --report-only --only-if-changed "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  record:
    name: Write the CI stage record
    needs:
      - validate-compose
      - harness-check
      - test-deployer-logic
      - test-1password-healthcheck
      - validate-vault-agent
      - validate-deployers
      - lint-python
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install the SDK that uv.lock pins
        run: |
          pip install "pydantic>=2.7,<3" pyyaml
          pip install --no-deps "$(python tools/sdk_requirement.py)"

      - name: Write the post record of this commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m common.deploy.stage_record

      - name: Upload the record
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always() && env.STAGE_RECORD_POST != ''
        with:
          name: ${{ env.STAGE_RECORD_POST }}
          path: stage-records/${{ env.STAGE_RECORD_POST }}.json
          if-no-files-found: ignore

  harness-replay:
    name: Replay Merge Gate
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.gate_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install the SDK that uv.lock pins
        run: |
          pip install "pydantic>=2.7,<3" pyyaml rich invoke
          pip install --no-deps "$(python tools/sdk_requirement.py)"

      - name: Replay last 20 merged PRs against origin/main
        id: replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          python -m tools.pr_merge_gate --replay 20 --repo "${{ github.repository }}" --json > replay-report.json
          python - <<'PY'
          import json, os, subprocess

          marker = "<!-- harness-replay-comment -->"
          report = json.loads(open("replay-report.json", encoding="utf-8").read())
          print(f"replayed={report['replayed']} direction={report['direction']} changed={len(report['rows'])}")
          lines = [
              marker,
              f"### Merge Gate Replay (`{report['replayed']}` PRs vs `origin/main`): **{report['direction']}**",
              "",
          ]
          if report["rows"]:
              lines.append("| PR | `main` | `head` | Direction | Added reasons | Removed reasons |")
              lines.append("|---|---|---|---|---|---|")
              for row in report["rows"]:
                  lines.append(
                      f"| #{row['number']} | `{row['main']}` | `{row['head']}` | `{row['direction']}` "
                      f"| {', '.join(row['reasons_added']) or '-'} | {', '.join(row['reasons_removed']) or '-'} |"
                  )
          else:
              lines.append("Zero verdict changes across all replayed PRs.")
          body = "\n".join(lines) + "\n"
          repo = os.environ["GITHUB_REPOSITORY"]
          pr_num = os.environ["PR_NUMBER"]
          comments = json.loads(subprocess.check_output(["gh", "api", f"/repos/{repo}/issues/{pr_num}/comments"], text=True))
          existing = next((c["id"] for c in comments if marker in str(c.get("body", ""))), None)
          if existing is not None:
              subprocess.run(
                  ["gh", "api", f"/repos/{repo}/issues/comments/{existing}", "-X", "PATCH", "-f", f"body={body}"],
                  check=True,
              )
          else:
              subprocess.run(
                  ["gh", "api", f"/repos/{repo}/issues/{pr_num}/comments", "-X", "POST", "-f", f"body={body}"],
                  check=True,
              )
          PY

      - name: Write the gate replay preview stage record
        if: always() && steps.replay.outcome != 'skipped'
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from common.gate.self_governance import is_self_governing
          from common.observability.issue_trail import CheckVerdict
          from common.deploy.stage_record import utc_now, write_stage_record

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["PR_BASE_SHA"], os.environ["PR_HEAD_SHA"]],
              text=True,
          ).splitlines()
          units = sorted({f"harness:{path}" for path in diff if path and is_self_governing(path)}) or ["harness:gate"]
          detail = "unknown"
          report_path = Path("replay-report.json")
          if report_path.is_file() and report_path.stat().st_size > 0:
              detail = json.loads(report_path.read_text(encoding="utf-8")).get("direction", detail)
          now = utc_now()
          write_stage_record(
              env="preview.runtime",
              phase="post",
              subject=f"sha:{os.environ['PR_HEAD_SHA']}",
              ref=os.environ["GITHUB_REF"],
              event="pull_request",
              run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              started_at=now,
              checks=[CheckVerdict(name="harness-replay", ok=os.environ["REPLAY_OUTCOME"] == "success", detail=detail, seconds=0.0)],
              units=units,
          )
          PY

      - name: Upload the gate replay stage record
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always() && env.STAGE_RECORD_POST != ''
        with:
          name: ${{ env.STAGE_RECORD_POST }}
          path: stage-records/${{ env.STAGE_RECORD_POST }}.json
          if-no-files-found: ignore
