name: Reconcile IaC Inputs

# Release-tag input-drift reconcile for iac_pinned services.
# staging/prod deploy immutable release tags only (promote-not-rebuild), so this GitOps
# trigger fires on a release tag push — NOT on every main push — and promotes that tag.
# It diffs the previous release tag -> this tag, fans the changed iac_pinned services into
# deploy_v2/iac_runner (pinned to the tag), where the Deployer config-hash gate decides
# no-op vs real redeploy. Dokploy native autoDeploy stays disabled.

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      before:
        description: "Optional base release tag for changed-file detection (defaults to the previous v*.*.* tag)"
        required: false
        default: ""
      after:
        description: "Target release tag to promote; defaults to this workflow ref"
        required: false
        default: ""
      dry_run:
        description: "Plan and summarize without invoking deploy_v2"
        required: false
        type: boolean
        default: false
      promote_prod:
        description: "Explicitly promote PROD (production deploys). A tag push never auto-deploys prod — only staging soaks automatically."
        required: false
        type: boolean
        default: false

permissions:
  # Explicit production promotion records an immutable production/v* marker.
  contents: write
  # the promotion guard lists this workflow's runs for the promoted tag (gh run list)
  actions: read

concurrency:
  group: iac-input-reconcile-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile iac-pinned inputs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IAC_WEBHOOK_SECRET: ${{ secrets.IAC_WEBHOOK_SECRET }}
      # reconcile shells out to tools.deploy_v2, whose on-main guard needs an authenticated
      # GitHub compare call (#635).
      GITHUB_TOKEN: ${{ github.token }}
      IAC_RUNNER_URL: ${{ vars.IAC_RUNNER_URL || 'https://iac.zitian.party' }}
      INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'zitian.party' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install invoke httpx python-dotenv pyyaml rich

      # A tag-push checkout has the full history (fetch-depth: 0) but no origin/main
      # remote-tracking ref. The reconcile guard (assert_after_on_main) refuses any tag
      # not reachable from origin/main, so make that ref resolvable here.
      - name: Fetch origin/main for provenance guard
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # Production promotion guard (2026-09-07 incident, #635 / #712): an unattended
      # promote_prod picked up v1.1.61 whose own staging reconcile had FAILED (the generated
      # alerting template aborted on a missing key); production alerting crash-looped until
      # the rollback. The soak that a tag push runs on staging is the precondition for
      # production, so the promotion refuses a tag without a green push-triggered run of this
      # workflow. A dispatch-triggered staging run does not count (it may have been a dry run,
      # or a promotion itself); the remedy is a new tag. The identity of the promoted tag is
      # checked here as well, and the change set production will receive is listed.
      - name: Production promotion guard (soak, identity, change set)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_prod }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_AFTER: ${{ inputs.after || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          after="${INPUT_AFTER:-$REF_NAME}"
          if [[ ! "$after" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::promote_prod promotes a release tag (vX.Y.Z); got '$after'."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$after" >/dev/null; then
            echo "::error::release tag '$after' does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$after" origin/main; then
            echo "::error::release tag '$after' is not reachable from origin/main."
            exit 1
          fi
          runs="$(gh run list --workflow reconcile-iac-inputs.yml --event push --branch "$after" \
                    --json conclusion,status,url,createdAt --limit 10)"
          soak="$(jq -r '[.[] | select(.conclusion == "success")] | first | .url // empty' <<<"$runs")"
          if [[ -z "$soak" ]]; then
            echo "::error::'$after' has no green staging soak: no push-triggered run of this workflow for the tag concluded success. Seen: $(jq -c '[.[] | {conclusion, status, url}]' <<<"$runs"). Fix the release and cut a new tag; production is never promoted from a tag whose staging reconcile did not pass."
            exit 1
          fi
          echo "staging soak of $after: $soak (concluded $(jq -r '[.[] | select(.conclusion == "success")] | first | .createdAt' <<<"$runs"))"
          marker="$(git tag --list 'production/v*.*.*' --sort=-v:refname | head -n1 || true)"
          echo "production marker: ${marker:-<none>}"
          if [[ -n "$marker" ]]; then
            echo "change set production receives (${marker#production/} -> $after):"
            git diff --stat "${marker#production/}" "$after" -- . ':!docs' ':!*.md' | tail -n 60
          fi

      - name: Reconcile changed IaC inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BEFORE: ${{ inputs.before || '' }}
          INPUT_AFTER: ${{ inputs.after || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_PROMOTE_PROD: ${{ inputs.promote_prod || false }}
        run: |
          set -euo pipefail

          # after = the release tag being promoted; before = the previous v*.*.* tag.
          # staging/prod accept tags only, so reconcile always pins the tag (not a sha).
          after="$REF_NAME"
          dry_run="false"
          # Release decoupling: a tag push auto-applies STAGING only (soak). Prod is an
          # explicit, deliberate promotion via workflow_dispatch (promote_prod=true) —
          # a tag push NEVER auto-deploys prod.
          promote_prod="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            after="${INPUT_AFTER:-$REF_NAME}"
            dry_run="$INPUT_DRY_RUN"
            promote_prod="$INPUT_PROMOTE_PROD"
          fi

          before="${INPUT_BEFORE:-}"
          if [[ "$promote_prod" == "true" ]]; then
            # Production is cumulative from its own desired-state marker, not from
            # the previous staging candidate.  Otherwise vN+1/vN+2 staging-only
            # changes are silently skipped when vN+3 is finally promoted.
            production_marker="$(git tag --list 'production/v*.*.*' --sort=-v:refname | head -n1 || true)"
            if [[ -n "$production_marker" ]]; then
              production_before="${production_marker#production/}"
              if [[ -n "$before" && "$before" != "$production_before" ]]; then
                echo "::error::production before must match $production_marker; got '$before'."
                exit 1
              fi
              before="$production_before"
            elif [[ -z "$before" ]]; then
              echo "::error::first production marker requires an explicit known-production 'before' release."
              exit 1
            fi
          elif [[ -z "$before" ]]; then
            # Staging remains incremental from the immediately previous release.
            before="$(git tag --list 'v*.*.*' --sort=-v:refname --merged "${after}^" 2>/dev/null | head -n1 || true)"
          fi
          echo "Promoting release tag '$after' (base '${before:-<none>}')"

          if [[ "$dry_run" != "true" && -z "${IAC_WEBHOOK_SECRET:-}" ]]; then
            echo "::error::IAC_WEBHOOK_SECRET is required for IaC input reconcile."
            exit 1
          fi
          if [[ "$dry_run" != "true" && -z "${IAC_RUNNER_URL:-}" ]]; then
            echo "::error::IAC_RUNNER_URL is required for IaC input reconcile."
            exit 1
          fi

          args=(--after "$after"
                --domain "$INTERNAL_DOMAIN"
                --timeout 3300
                --output-json reconcile-result.json)
          [[ -n "$before" ]] && args+=(--before "$before")
          [[ "$dry_run" == "true" ]] && args+=(--dry-run)
          [[ "$promote_prod" == "true" ]] && args+=(--promote-prod)

          python -m tools.reconcile_iac_inputs "${args[@]}"

      - name: Upload reconcile result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iac-input-reconcile-result
          path: reconcile-result.json
          if-no-files-found: ignore
